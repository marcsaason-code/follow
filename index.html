ações valem para novos envios.</p></section><section class="card"><h2>Mensagens do WhatsApp</h2><p class="muted">Variáveis disponíveis: {nome}, {valor}, {empresa}, {link}.</p><div class="fields">${area('Envio do orçamento','send',s.send)}${area('Acompanhamento','follow',s.follow)}${area('Negociação','negotiation',s.negotiation)}</div></section><div class="actions"><button class="primary" type="submit">Salvar configurações</button>${button('Exportar backup','backup')}${button('Importar backup','importBackup')}${button('Importar resposta do cliente','importResponse')}</div></form>`}
function admin(){return heading('Administração da plataforma','Empresas, responsáveis e situação dos cadastros.')+`<div class="notice">Painel local. Autenticação, bloqueio de acesso e cobrança serão ativados com a conexão ao backend.</div><div class="grid">${metric('Ativos',db.accounts.filter(a=>a.status==='Ativo').length)}${metric('Em teste',db.accounts.filter(a=>a.status==='Trial').length)}${metric('Bloqueados',db.accounts.filter(a=>a.status==='Bloqueado').length)}${metric('Recorrência cadastrada',money(db.accounts.filter(a=>a.status==='Ativo').reduce((s,a)=>s+a.price,0)))}</div><div class="card"><div class="row"><h2>Empresas da plataforma</h2>${button('+ Cadastrar empresa','newAccount','','primary')}</div>${db.accounts.length?`<div class="tablewrap"><table><thead><tr><th>Empresa / responsável</th><th>E-mail</th><th>Mensalidade</th><th>Situação</th><th></th></tr></thead><tbody>${db.accounts.map(a=>`<tr><td>${esc(a.company)}<br><small>${esc(a.name)}</small></td><td>${esc(a.email)}</td><td>${money(a.price)}</td><td>${esc(a.status)}</td><td>${button('Editar','editAccount',a.id,'small')} ${button('Excluir','deleteAccount',a.id,'small danger')}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma empresa cadastrada.')}</div>`}
function clientForm(id='',fromQuote=false){const c=db.clients.find(c=>c.id===id)||{};modal(id?'Editar cliente':'Novo cliente',`<form id="clientForm" data-id="${esc(id)}" data-return="${fromQuote}"><div class="fields">${field('Nome','name',c.name,'text','required maxlength="120"')}${field('WhatsApp com DDD','phone',c.phone,'tel','required')}${field('E-mail','email',c.email,'email')}${field('Empresa','company',c.company)}${field('CPF / CNPJ','doc',c.doc)}${field('Endereço','address',c.address)}${area('Observações','notes',c.notes)}</div><div class="formfoot"><button type="submit" class="primary">Salvar cliente</button></div></form>`)}

function newDraft(id){const q=qget(id);draft=q?structuredClone(q):{id:uid(),clientId:db.clients[0]?.id||'',title:'Prestação de serviços',items:[{description:'',qty:1,price:0}],discount:0,validUntil:addDays(day(),db.settings.validDays),deadline:db.settings.deadline,payment:db.settings.payment,notes:db.settings.notes,status:'Rascunho',history:[]};quoteForm()}
function quoteForm(){modal(draft.number?'Editar orçamento #'+draft.number:'Novo orçamento',`<form id="quoteForm"><div class="fields"><div class="full"><label for="quoteClient">Cliente</label><div class="row" style="flex-wrap:nowrap"><select id="quoteClient" name="clientId" required><option value="">Selecione um cliente</option>${db.clients.map(c=>`<option value="${c.id}" ${draft.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${button('+ Cliente','quoteNewClient','','small')}</div></div><div class="full">${field('Título do orçamento','title',draft.title,'text','required')}</div></div><h3 style="margin-top:22px">Itens</h3><label for="catalog">Adicionar do catálogo</label><select id="catalog"><option value="">Selecione um serviço ou produto</option>${db.services.map(s=>`<option value="${s.id}">${esc(s.name)} — ${money(s.price)}</option>`).join('')}</select><div class="item muted"><span>Descrição</span><span>Qtd.</span><span>Unitário R$</span><span></span></div><div id="items">${itemInputs()}</div>${button('+ Adicionar item','addItem','','small')}<div class="fields" style="margin-top:20px">${field('Desconto total (R$)','discount',draft.discount,'number','min="0" step="0.01" required')}${field('Válido até','validUntil',draft.validUntil,'date','required')}${field('Prazo de execução','deadline',draft.deadline)}${area('Forma de pagamento','payment',draft.payment)}${area('Observações','notes',draft.notes)}</div><div class="total" id="draftTotal">${money(total(draft))}</div><div class="formfoot"><button type="submit" name="mode" value="draft">Salvar rascunho</button><button type="submit" name="mode" value="generate" class="primary">Gerar orçamento</button></div></form>`)}
function itemInputs(){return draft.items.map((i,n)=>`<div class="item" data-index="${n}"><input aria-label="Descrição do item ${n+1}" data-item="description" value="${esc(i.description)}" required><input aria-label="Quantidade do item ${n+1}" data-item="qty" type="number" min="0.01" step="0.01" value="${i.qty}" required><input aria-label="Preço do item ${n+1}" data-item="price" type="number" min="0" step="0.01" value="${i.price}" required>${button('×','removeItem',String(n),'small')}</div>`).join('')}
function collectDraft(){const f=$('#quoteForm');if(!f)return;const v=Object.fromEntries(new FormData(f));Object.assign(draft,v,{discount:Number(v.discount)||0});draft.items=$$('.item[data-index]',f).map(row=>({description:$('[data-item="description"]',row).value,qty:Number($('[data-item="qty"]',row).value),price:Number($('[data-item="price"]',row).value)}))}
function safeLogo(s){return typeof s==='string'&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(s)}
function snapshot(q){return {version:1,tenantId:activeTenantId,workspace:db.workspace,id:q.id,number:q.number,revision:q.revision||1,title:q.title,customer:{name:client(q.clientId).name},company:{name:db.settings.company,doc:db.settings.doc,email:db.settings.email,phone:db.settings.phone,address:db.settings.address,logo:safeLogo(db.settings.logo)?db.settings.logo:''},items:q.items,discount:q.discount,validUntil:q.validUntil,deadline:q.deadline,payment:q.payment,notes:q.notes,status:q.status}}
function encode(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));let str='';bytes.forEach(b=>str+=String.fromCharCode(b));return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decode(s){let raw=s.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(raw),c=>c.charCodeAt(0))))}
function publicURL(q){return location.href.split(/[?#]/)[0]+'#orcamento='+encode(snapshot(q))}
function quoteContent(p){return `<div class="row"><div>${safeLogo(p.company.logo)?`<img class="company-logo" src="${p.company.logo}" alt="Logo da empresa">`:`<h2>${esc(p.company.name)}</h2>`}<div class="muted">${esc(p.company.name)}${p.company.doc?'<br>'+esc(p.company.doc):''}</div></div><div class="number">ORÇAMENTO #${esc(p.number)}</div></div><h1>${esc(p.title)}</h1><p>Olá, <b>${esc(p.customer.name)}</b>. Confira os detalhes da proposta.</p><div class="tablewrap"><table><thead><tr><th>Descrição</th><th>Qtd.</th><th>Unitário</th><th>Subtotal</th></tr></thead><tbody>${p.items.map(i=>`<tr><td>${esc(i.description)}</td><td>${i.qty}</td><td class="nowrap">${money(i.price)}</td><td class="nowrap">${money(i.qty*i.price)}</td></tr>`).join('')}</tbody></table></div>${p.discount?`<p style="text-align:right">Desconto: ${money(p.discount)}</p>`:''}<div class="total"><small style="font-size:13px;font-weight:500">Valor total</small><br>${money(total(p))}</div><div class="fields"><div><label>Validade</label>${date(p.validUntil)}</div><div><label>Prazo de execução</label><div class="details">${esc(p.deadline)||'A combinar'}</div></div><div class="full"><label>Pagamento</label><div class="details">${esc(p.payment)||'A combinar'}</div></div>${p.notes?`<div class="full"><label>Observações</label><div class="details">${esc(p.notes)}</div></div>`:''}</div><footer>${esc(p.company.phone)} ${p.company.email?' · '+esc(p.company.email):''}<br>${esc(p.company.address)}</footer>`}
function openQuote(id){const q=qget(id);if(!q)return;$('#modal').dataset.quoteId=id;modal('Orçamento #'+q.number,`<div class="row">${badge(q)}<span class="muted">${q.views||0} abertura(s) de teste neste navegador</span></div><div class="actions" style="margin:18px 0">${button('Editar','editQuote',id,'small')}${button('Duplicar','duplicateQuote',id,'small')}${button('Abrir página do cliente','preview',id,'small')}${button('Imprimir / PDF','printQuote',id,'small')}${button('Excluir','deleteQuote',id,'small danger')}</div><div class="card">${quoteContent(snapshot(q))}</div><div class="actions" style="margin-top:20px">${button('Copiar link','copyLink',id)}${button('Enviar pelo WhatsApp','sendWA',id,'primary')}${!q.sentAt?button('Confirmar envio','confirmSent',id):''}${!closed(q)?button('Cancelar orçamento','cancelQuote',id,'danger'):''}</div><p class="muted">${location.protocol==='file:'?'O link é local. Para compartilhar com outro dispositivo, hospede o HTML e gere o link novamente.':'Link de teste com uma cópia dos dados. Respostas em outros dispositivos exigem importação manual enquanto não houver banco.'}</p><h3>Histórico</h3><div class="timeline">${q.history.slice().reverse().map(h=>`<p><small class="muted">${stamp(h.at)}</small><br>${esc(h.text)}</p>`).join('')}</div>`)}
function confirmSent(id){const q=qget(id);if(closed(q))return toast('Este orçamento já foi encerrado.');if(q.sentAt)return toast('O envio já foi registrado.');if(commit(()=>{q.sentAt=new Date().toISOString();if(q.status==='Rascunho')q.status='Enviado';event(q,'Envio confirmado pela empresa');schedule(q)})){render();openQuote(id);toast('Envio registrado e retornos preparados.')}}
async function copyLink(id){let link=publicURL(qget(id));try{await navigator.clipboard.writeText(link);toast(location.protocol==='file:'?'Link local copiado. Só funcionará neste computador.':'Link de teste copiado.')}catch(e){modal('Copiar link',`<p>${location.protocol==='file:'?'Este é um link local; hospede o arquivo para compartilhar.':'Selecione e copie o link abaixo.'}</p><textarea readonly id="copyValue">${esc(link)}</textarea>`);$('#copyValue').select()}}
function phoneNumber(s){let p=String(s).replace(/\D/g,'');if(p.length===10||p.length===11)p='55'+p;return /^\d{12,15}$/.test(p)?p:null}
function whatsapp(phone,msg){const p=phoneNumber(phone);if(!p)return toast('Informe um WhatsApp válido com DDD.');window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')}
function message(q,template){const c=client(q.clientId);return template.replace(/\{nome\}/g,c.name).replace(/\{valor\}/g,money(total(q))).replace(/\{empresa\}/g,db.settings.company).replace(/\{link\}/g,location.protocol==='file:'?'[link disponível após hospedar o HTML]':publicURL(q))}
function parsePublic(){const hash=new URLSearchParams(location.hash.slice(1));if(!hash.has('orcamento'))return false;try{const s=hash.get('orcamento');if(s.length>200000)throw Error();const p=decode(s);if(p.version!==1||typeof p.workspace!=='string'||typeof p.id!=='string'||!p.customer||!p.company||!Array.isArray(p.items)||!p.items.length||p.items.length>200||p.items.some(i=>typeof i.description!=='string'||!Number.isFinite(i.qty)||!Number.isFinite(i.price)||i.qty<=0||i.price<0)||!Number.isFinite(p.discount)||p.discount<0||!/^\d{4}-\d{2}-\d{2}$/.test(p.validUntil))throw Error();publicData=p;if(typeof p.tenantId==='string'&&/^[A-Za-z0-9-]+$/.test(p.tenantId)){KEY='follow.unificado.v3.tenant.'+p.tenantId;db=Repository.load();activeTenantId=p.tenantId;}let q=db.workspace===p.workspace?qget(p.id):null;if(q&&(q.revision||1)===(p.revision||1)&&!closed(q)){commit(()=>{q.views=(q.views||0)+1;q.lastViewedAt=new Date().toISOString();if(q.status==='Enviado')q.status='Visualizado';event(q,'Abertura da página do cliente (teste local)')})}renderPublic()}catch(e){$('#app').innerHTML='<div class="quote"><h1>Link inválido</h1><p>O link pode estar incompleto. Solicite um novo orçamento à empresa.</p></div>'}return true}
function responseKey(p){return 'follow.response.'+p.workspace+'.'+p.id+'.'+(p.revision||1)}
function readResponse(){try{return JSON.parse(localStorage.getItem(responseKey(publicData))||'null')}catch{return null}}
function renderPublic(){const p=publicData,q=db.workspace===p.workspace?qget(p.id):null,r=readResponse();const expired=p.validUntil<day(),outdated=q&&(q.revision||1)!==(p.revision||1),finalStatus=q?status(q):r?.status||p.status;const locked=expired||outdated||['Aprovado','Recusado','Cancelado'].includes(finalStatus);$('#app').innerHTML=`<div class="public-wrap"><div class="notice no-print">Página de teste. Sem banco de dados, a resposta fica neste navegador. Use as opções abaixo para enviar a confirmação à empresa.</div><article class="quote">${quoteContent(p)}<section class="no-print" style="margin-top:25px">${outdated?'<div class="notice">O orçamento foi alterado. Solicite um novo link à empresa.</div>':expired?'<div class="notice">A validade deste orçamento terminou. Solicite uma atualização à empresa.</div>':['Aprovado','Recusado','Cancelado'].includes(finalStatus)?`<div class="notice good">Orçamento ${esc(finalStatus.toLowerCase())}.</div>`:r?`<div class="notice good">Resposta registrada neste navegador: ${esc(r.status)}.</div>`:''}${!locked?`<h2>Como deseja seguir?</h2><div class="actions">${button('Aprovar orçamento','respond','Aprovado','primary')}${button('Quero negociar','respond','Negociação')}${button('Não tenho interesse','respond','Recusado','danger')}</div>`:''}${r?`<p class="muted">${q?'A resposta também foi salva no painel local desta empresa.':'A empresa ainda precisa receber sua resposta. Envie pelo WhatsApp ou baixe a confirmação para encaminhar.'}</p><div class="actions">${button('Enviar resposta pelo WhatsApp','responseWA')}${button('Baixar confirmação','downloadResponse')}</div>`:''}<div class="actions" style="margin-top:20px">${button('Imprimir / salvar PDF','print')}</div></section></article></div>`}
function responseForm(s){const p=publicData;if(p.validUntil<day())return toast('Orçamento expirado.');modal(s==='Aprovado'?'Confirmar aprovação':s==='Negociação'?'Solicitar negociação':'Recusar orçamento',`<form id="responseForm" data-status="${s}"><p>Orçamento #${esc(p.number)} · <b>${money(total(p))}</b></p>${s==='Aprovado'?'<p>Ao confirmar, você informa que concorda com os itens e condições apresentados.</p>':''}<div class="fields">${field('Seu nome','name',p.customer.name,'text','required')}${area(s==='Negociação'?'O que gostaria de negociar?':'Observação (opcional)','note','')}</div><p class="muted">Esta versão registra uma confirmação de teste, sem autenticação ou assinatura digital.</p><div class="formfoot"><button class="primary">Confirmar resposta</button></div></form>`)}
function applyResponse(r){if(!r||r.type!=='follow-response'||r.workspace!==db.workspace||!['Aprovado','Negociação','Recusado'].includes(r.status)||typeof r.name!=='string'||typeof r.note!=='string')throw Error('Confirmação incompatível com esta empresa.');const q=qget(r.quoteId);if(!q)throw Error('Orçamento não encontrado.');if(r.revision!==(q.revision||1))throw Error('Resposta referente a uma versão anterior do orçamento.');if(closed(q))throw Error('Este orçamento foi encerrado ou expirou.');setStatus(q,r.status,`${r.name}: ${r.note||'Sem observação'}`);q.response=r}
function importFile(kind){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{if(input.files[0].size>10000000)throw Error('Arquivo muito grande.');const value=JSON.parse(await input.files[0].text());if(kind==='backup'){validate(value);if(!confirm('Substituir os dados locais por este backup? Exporte os dados atuais antes de continuar.'))return;if(commit(()=>db=value)){render();toast('Backup importado.')}}else{if(!confirm('Importar esta confirmação manual? O arquivo não comprova a identidade de quem respondeu.'))return;if(commit(()=>applyResponse(value))){render();toast('Resposta importada.')}}}catch(e){toast(e.message)}};input.click()}
async function uploadLogo(file){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5000000)return toast('Escolha PNG, JPG ou WebP de até 5 MB.');try{const bitmap=await createImageBitmap(file), canvas=document.createElement('canvas');const ratio=Math.min(1,220/bitmap.width,110/bitmap.height);canvas.width=Math.round(bitmap.width*ratio);canvas.height=Math.round(bitmap.height*ratio);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);const logo=canvas.toDataURL('image/webp',.7);if(logo.length>45000)return toast('Logo muito detalhada. Use uma imagem menor.');$('#settingsForm').dataset.logo=logo;$('#logoPreview').innerHTML=`<img class="logo-preview" src="${logo}" alt="Prévia da logo">`;toast('Logo preparada. Clique em Salvar configurações.')}catch(e){toast('Não foi possível ler a imagem.')}}
function seed(){if(db.quotes.length||db.clients.length)return toast('Os exemplos só são adicionados a uma base vazia.');if(commit(()=>{let c={id:uid(),name:'Carlos Silva — exemplo',phone:'',email:'',company:'',notes:''};db.clients.push(c);db.services.push({id:uid(),name:'Instalação',price:400,unit:'serviço'});let q={id:uid(),number:db.nextNumber++,revision:1,clientId:c.id,title:'Instalação de câmeras',items:[{description:'Câmeras',qty:4,price:200},{description:'DVR',qty:1,price:450},{description:'Instalação',qty:1,price:400},{description:'Cabeamento',qty:1,price:200}],discount:0,validUntil:addDays(day(),7),deadline:'2 dias úteis',payment:db.settings.payment,notes:'Dados de exemplo. Substitua por suas informações.',status:'Enviado',sentAt:new Date().toISOString(),history:[]};event(q,'Exemplo criado');db.quotes.push(q);schedule(q)})){view='dash';render();toast('Exemplo adicionado.')}}
const actions={close:()=>$('#modal').close(),nav:id=>{if(!nav.some(n=>n[0]===id))return;view=id;term='';filter='';render()},newQuote:()=>newDraft(),editQuote:id=>{const q=qget(id);if(closed(q))return toast('Duplique o orçamento encerrado para criar uma nova proposta.');newDraft(id)},openQuote,newClient:()=>clientForm(),editClient:clientForm,newService:()=>serviceForm(),editService:serviceForm,newAccount:()=>accountForm(),editAccount:accountForm,taskTab:id=>{taskTab=id;render()},quoteNewClient:()=>{collectDraft();clientForm('',true)},addItem:()=>{collectDraft();draft.items.push({description:'',qty:1,price:0});quoteForm()},removeItem:id=>{collectDraft();if(draft.items.length===1)return toast('Mantenha pelo menos um item.');draft.items.splice(Number(id),1);quoteForm()},clientHistory:id=>{const c=client(id);modal('Histórico de '+c.name,`<p>${esc(c.phone)} · ${esc(c.email)}</p><p>${esc(c.notes||'')}</p>${quoteTable(db.quotes.filter(q=>q.clientId===id))}`)},deleteClient:id=>{if(db.quotes.some(q=>q.clientId===id))return toast('Este cliente possui orçamentos e não pode ser excluído.');if(confirm('Excluir este cliente?')&&commit(()=>db.clients=db.clients.filter(c=>c.id!==id)))render()},deleteService:id=>{if(confirm('Excluir do catálogo? Os orçamentos existentes serão preservados.')&&commit(()=>db.services=db.services.filter(s=>s.id!==id)))render()},deleteAccount:id=>{if(confirm('Excluir este cadastro local?')&&commit(()=>db.accounts=db.accounts.filter(s=>s.id!==id)))render()},deleteQuote:id=>{if(confirm('Excluir orçamento e seus retornos? Links já compartilhados continuam contendo a cópia antiga.')&&commit(()=>{db.quotes=db.quotes.filter(q=>q.id!==id);db.tasks=db.tasks.filter(t=>t.quoteId!==id)})){$('#modal').close();render()}},duplicateQuote:id=>{newDraft(id);draft.id=uid();delete draft.number;delete draft.sentAt;delete draft.response;delete draft.views;draft.status='Rascunho';draft.history=[];draft.validUntil=addDays(day(),db.settings.validDays);quoteForm()},cancelQuote:id .status}. Nome: ${r.name}. ${r.note||''}`)},seed,logout:()=>{signedIn=false;$('#modal').close();$('#app').innerHTML='';document.getElementById('auth-frame').hidden=false;document.getElementById('auth-frame').contentWindow.postMessage({type:'follow-signout'},'*')},resume:()=>render()};

if(f.id==='responseForm'){const p=publicData,q=db.workspace===p.workspace?qget(p.id):null;if(p.validUntil<day()||(q&&closed(q)))throw Error('Este orçamento já foi encerrado ou expirou.');let r={type:'follow-response',workspace:p.workspace,quoteId:p.id,revision:p.revision||1,status:f.dataset.status,name:v.name.trim(),note:v.note||'',at:new Date().toISOString()};if(!r.name)throw Error('Informe seu nome.');if(q){if(!commit(()=>applyResponse(r)))return}localStorage.setItem(responseKey(p),JSON.stringify(r));$('#modal').close();renderPublic();toast('Resposta registrada neste navegador.')}}catch(err){toast(err.message)}});

function startAuthentication(){
  const frame=document.createElement('iframe');frame.id='auth-frame';frame.title='FOLLOW — Login e administração';frame.style.cssText='border:0;position:fixed;inset:0;width:100%;height:100%;background:#f4f5f7;z-index:10';
  window.addEventListener('message',e=>{
    if(e.source!==frame.contentWindow)return;
    if(e.data?.type==='follow-auth-screen'){
      signedIn=false;$('#modal').close();$('#app').innerHTML='';frame.hidden=false;
    }
    if(e.data?.type==='follow-auth-tenant'&&typeof e.data.tenantId==='string'&&/^[A-Za-z0-9-]+$/.test(e.data.tenantId)){
      activeTenantId=e.data.tenantId;KEY='follow.unificado.v3.tenant.'+activeTenantId;
      db=Repository.load();if(db.settings.company==='Minha empresa')db.settings.company=String(e.data.company||'Minha empresa');
      signedIn=true;frame.hidden=true;view='dash';render();
    }
  });
  frame.srcdoc=AUTH_DOCUMENT;document.body.appendChild(frame);
}
if(!parsePublic())startAuthentication();
