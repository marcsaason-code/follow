o',monospace;}\n\n/* SIDEBAR */\naside.sidebar{\n  width:224px; flex-shrink:0; background:var(--sidebar); color:var(--sidebar-text);\n  min-height:100vh; padding:20px 14px calc(20px + env(safe-area-inset-bottom,0px));\n  padding-top: calc(20px + env(safe-area-inset-top,0px));\n  display:flex; flex-direction:column; gap:26px; position:sticky; top:0; align-self:flex-start;\n}\n.brand{display:flex; align-items:center; justify-content:center; gap:9px; padding:4px 4px 10px;}\n.brand img{height:48px; width:auto; display:block;}\n.brand .word{font-size:1.2rem; font-weight:800; color:#fff; letter-spacing:-0.01em;}\nnav.tabs{display:flex; flex-direction:column; gap:3px;}\nnav.tabs button{\n  border:none; background:transparent; padding:10px 12px; font-family:inherit; font-size:0.88rem;\n  font-weight:600; color:var(--sidebar-text); cursor:pointer; border-radius:8px;\n  display:flex; align-items:center; justify-content:space-between; text-align:left; gap:8px;\n}\nnav.tabs button:hover{background:#1c1d20; color:#fff;}\nnav.tabs button.active{background:var(--grad); color:#fff;}\nnav.tabs button .badge{background:rgba(255,255,255,0.18); font-size:0.7rem; padding:1px 7px; border-radius:20px; font-family:'IBM Plex Mono',monospace;}\nnav.tabs button.active .badge{background:rgba(255,255,255,0.3);}\n.sidebar-foot{margin-top:auto; font-size:0.68rem; color:#5c5e64; padding:0 8px; line-height:1.5;}\n\nmain{flex:1; max-width:100%; min-width:0; margin:0 auto; padding:28px 32px 80px;}\n.content-wrap{max-width:920px; margin:0 auto;}\n@media (max-width:780px){\n  body{flex-direction:column;}\n  aside.sidebar{width:100%; min-height:auto; position:sticky; top:0; z-index:20; flex-direction:row; align-items:center; padding:12px 14px; gap:14px;}\n  .brand{padding:0;}\n  nav.tabs{flex-direction:row; flex:1; overflow-x:auto;}\n  nav.tabs button{white-space:nowrap;}\n  .sidebar-foot{display:none;}\n  main{padding:20px 16px 70px;}\n}\n\n/* DASHBOARD */\n.hero-row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:22px; flex-wrap:wrap;}\n.hero-row h2{font-size:1.7rem; margin:0; font-weight:800; letter-spacing:-0.01em;}\n.hero-row .date{font-size:0.85rem; color:var(--ink); opacity:0.55;}\n.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px;}\n.stat{cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}\n.stat:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(17,18,20,0.08);}\n.stat{background:var(--white); padding:18px 18px; border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); position:relative; overflow:hidden;}\n.stat::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--grad);}\n.stat .num{font-size:2rem; font-weight:800; line-height:1; font-family:'IBM Plex Mono',monospace;}\n.stat .label{font-size:0.78rem; opacity:0.6; margin-top:6px;}\n@media (max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr);}}\n\n.attention{border:1px solid var(--line); background:var(--white); padding:4px 0; margin-bottom:32px; border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}\n.attention .head{padding:14px 18px 10px; font-weight:700; font-size:0.95rem;}\n.arow{display:flex; align-items:center; gap:12px; padding:12px 18px; border-top:1px solid var(--line); cursor:pointer;}\n.arow:hover{background:var(--paper);}\n.dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}\n.dot.red{background:var(--red);}\n.dot.yellow{background:var(--yellow);}\n.dot.orange{background:#c9711f;}\n.arow .txt{flex:1; font-size:0.92rem;}\n.arow .n{font-family:'IBM Plex Mono',monospace; font-weight:700;}\n\n.funnel{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:8px;}\n.funnel .stage{flex:1; min-width:100px; background:var(--white); border:1px solid var(--line); border-radius:12px; padding:12px 14px; text-align:center; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}\n.funnel .stage:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(17,18,20,0.08);}\n.funnel .stage .n{font-family:'IBM Plex Mono',monospace; font-weight:800; font-size:1.3rem; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}\n.funnel .stage .l{font-size:0.72rem; opacity:0.6; margin-top:3px;}\n\nsection h3.section-title{font-size:0.85rem; text-transform:none; font-weight:700; opacity:0.7; margin:0 0 10px;}\n\n/* CLIENT LIST */\n.toolbar{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center;}\n.toolbar input[type=text]{flex:1; min-width:180px; padding:10px 12px; border:1px solid var(--line); background:var(--white); color:var(--ink); font-family:inherit; font-size:0.9rem; border-radius:9px;}\n.toolbar select{padding:10px 12px; border:1px solid var(--line); background:var(--white); color:var(--ink); font-family:inherit; font-size:0.85rem; border-radius:9px;}\n.btn{background:var(--grad); color:var(--white); border:none; padding:10px 16px; font-family:inherit; font-weight:700; font-size:0.85rem; cursor:pointer; border-radius:9px; box-shadow:0 4px 10px rgba(242,55,79,0.22);}\n.btn:hover{filter:brightness(1.06);}\n.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:600; box-shadow:none;}\n.btn.small{padding:6px 11px; font-size:0.78rem;}\n.btn.danger{background:var(--red); box-shadow:none;}\n\n.client-card{border:1px solid var(--line); background:var(--white); padding:14px 16px; margin-bottom:8px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; border-radius:12px; box-shadow:var(--shadow);}\n.client-card .who{min-width:150px; flex:1;}\n.client-card .name{font-weight:700; font-size:1rem;}\n.client-card .co{font-size:0.78rem; opacity:0.55;}\n.client-card .val{font-family:'IBM Plex Mono',monospace; font-weight:700; min-width:90px;}\n.pill{font-size:0.7rem; font-weight:700; padding:3px 9px; border-radius:20px; whit dal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px;}\n\nfooter.tab-info{text-align:center; font-size:0.75rem; opacity:0.4; padding:20px 0 6px;}\n\n/* DISPARO */\n.banner{\n  max-width:920px; margin:0 auto;\n}\n.banner-inner{\n  display:flex; align-items:center; gap:12px; background:var(--grad); color:var(--white);\n  padding:13px 18px; margin-bottom:18px; cursor:pointer; border-radius:12px; box-shadow:0 6px 16px rgba(242,55,79,0.25);\n}\n.banner-inner .t{flex:1; font-weight:700; font-size:0.9rem;}\n.banner-inner .arrow{font-size:1.1rem;}\n\n.disparo-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}\n.disparo-head .sub{font-size:0.85rem; opacity:0.6; margin-top:2px;}\n.schedule-box{display:flex; align-items:center; gap:8px; font-size:0.82rem; opacity:0.8;}\n.schedule-box input[type=time]{padding:6px 8px; border:1px solid var(--line); background:var(--white); color:var(--ink); font-family:inherit; border-radius:8px;}\n\n.progress-bar{height:6px; background:var(--paper-2); border:1px solid var(--line); margin-bottom:22px; overflow:hidden;}\n.progress-bar .fill{height:100%; background:var(--green); transition:width .3s;}\n\n.send-card{border:1px solid var(--line); background:var(--white); padding:16px; margin-bottom:12px;}\n.send-card.sent{opacity:0.5;}\n.send-card .top-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap;}\n.send-card .who-info .name{font-weight:700; font-size:1rem;}\n.send-card .who-info .meta{font-size:0.78rem; opacity:0.6;}\n.send-card textarea{width:100%; min-height:64px; padding:10px 12px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); font-family:inherit; font-size:0.85rem; resize:vertical;}\n.send-card .bottom-row{display:flex; justify-content:flex-end; gap:8px; margin-top:10px;}\n.tag-late{background:var(--red); color:var(--white); font-size:0.68rem; font-weight:700; padding:2px 8px; border-radius:20px;}\n.tag-done{background:var(--green); color:var(--white); font-size:0.68rem; font-weight:700; padding:2px 8px; border-radius:20px;}\n\n.templates-btn{font-size:0.78rem; text-decoration:underline; background:none; border:none; color:var(--ink); opacity:0.65; cursor:pointer; font-family:inherit; padding:0;}\n.tmpl-field{margin-bottom:14px;}\n.tmpl-field label{display:block; font-size:0.78rem; font-weight:600; opacity:0.7; margin-bottom:5px;}\n.tmpl-field textarea{width:100%; min-height:56px; padding:9px 11px; border:1px solid var(--line); background:var(--white); color:var(--ink); font-family:inherit; font-size:0.85rem;}\n.tmpl-hint{font-size:0.72rem; opacity:0.5; margin-top:16px; line-height:1.5;}\n\n/* CONFIG */\n.cfg-sub{font-size:0.85rem; opacity:0.6; margin-bottom:24px;}\n.cfg-card{background:var(--white); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:20px 22px; margin-bottom:16px;}\n.cfg-title{font-weight:700; font-size:0.98rem; margin-bottom:4px;}\n.cfg-desc{font-size:0.82rem; opacity:0.55; margin-bottom:14px;}\n.cfg-time{font-family:'IBM Plex Mono',monospace; font-size:1.1rem; font-weight:700; padding:9px 14px; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink);}\n.dow-row{display:flex; gap:8px; flex-wrap:wrap;}\n.dow-row button{border:1px solid var(--line); background:var(--paper); color:var(--ink); font-family:inherit; font-weight:700; font-size:0.82rem; padding:8px 14px; border-radius:9px; cursor:pointer; opacity:0.55;}\n.dow-row button.on{background:var(--grad); color:#fff; border-color:transparent; opacity:1; box-shadow:0 4px 10px rgba(242,55,79,0.22);}\n.cfg-check{display:flex; align-items:center; gap:10px; font-size:0.9rem; font-weight:600; cursor:pointer; margin-bottom:2px;}\n.cfg-check input{width:17px; height:17px; accent-color:var(--accent2);}\n.cfg-steps{margin-top:16px; display:flex; flex-direction:column; gap:12px; padding-left:2px;}\n.cfg-step{display:flex; align-items:center; gap:8px; font-size:0.87rem;}\n.cfg-step span:first-child{min-width:130px; opacity:0.75;}\n.cfg-num{width:56px; font-family:'IBM Plex Mono',monospace; font-weight:700; text-align:center; padding:6px 4px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);}\n.cfg-saved{font-size:0.82rem; color:var(--green); margin-left:12px; opacity:0; transition:opacity .3s;}\n.cfg-saved.show{opacity:1;}\n\n/* TOPBAR */\n.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 32px 0;}\n.topbar .crumb{font-size:0.92rem; font-weight:700; opacity:0.85;}\n.topbar .crumb span{opacity:0.45; font-weight:600; margin-right:6px;}\n.logout-btn{display:flex; align-items:center; gap:7px; background:var(--white); border:1px solid var(--line); color:var(--ink); font-family:inherit; font-weight:600; font-size:0.82rem; padding:8px 14px; border-radius:9px; cursor:pointer; box-shadow:var(--shadow);}\n.logout-btn:hover{border-color:#f2374f; color:#f2374f;}\n.logout-btn svg{display:block;}\n@media (max-width:780px){ .topbar{padding:14px 16px 0;} }\n\n/* LOGIN */\n.login-screen{\n  position:fixed; inset:0; z-index:100; background:#0a0a0c;\n  display:flex; align-items:center; justify-content:center; padding:24px;\n}\n.login-screen::before{\n  content:''; position:absolute; inset:0;\n  background: radial-gradient(circle at 20% 20%, rgba(255,122,26,0.16), transparent 55%),\n              radial-gradient(circle at 80% 75%, rgba(242,55,79,0.14), transparent 55%);\n}\n.login-card{position:relative; z-index:1; width:100%; max-width:380px; background:#141417; border:1px solid #26282c; border-radius:18px; padding:36px 32px 32px; box-shadow:0 24px 70px rgba(0,0,0,0.5);}\n.login-card img{height:64px; display:block; margin:0 auto 22px;}\n.login-card h2{color:#fff; text-align:center; font-size:1.15rem; font-weight:800; margin:0 0 4px;}\n.login-card .sub{color:#9a9ca3; text-align:center; font-size:0.82rem; margin-bottom:26px;}\n.login-field{margin-bottom:14px;}\n.login-field label{display:block; font-size:0.76rem; font-weight:600; color:#9a9ca3; margin-bottom:6px;}\n.login-field input{width:100%; padding:11px 13px; border-radius:9px; border:1px solid #2c2e33; background:#1c1d20; color:#fff; font-family:inherit; font-size:0.9rem; box-sizing:border-box;}\n.login-field input:focus{outline:none; border-color:#ff7a1a;}\n.login-btn{width:100%; margin-top:10px; background:var(--grad); color:#fff; border:none; padding:12px; border-radius:9px; font-family:inherit; font-weight:700; font-size:0.92rem; cursor:pointer; box-shadow:0 8px 20px rgba(242,55,79,0.3);}\n.login-btn:hover{filter:brightness(1.06);}\n.login-foot{text-align:center; font-size:0.76rem; color:#5c5e64; margin-top:18px;}\n.login-error{color:#ff8080; font-size:0.78rem; text-align:center; margin-bottom:12px; display:none;}\n\n/* ADMIN */\n#admin-root{display:flex; width:100%;}\n@media (max-width:780px){ #admin-root{flex-direction:column;} }\n.twrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); background:var(--white);}\n.atable{width:100%; border-collapse:collapse; font-size:0.85rem; min-width:760px;}\n.atable th{text-align:left; font-size:0.7rem; text-transform:uppercase; letter-spacing:.05em; opacity:.55; padding:11px 14px; border-bottom:1px solid var(--line); background:var(--paper-2);}\n.atable td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}\n.atable tr:last-child td{border-bottom:none;}\n.atable .sub{font-size:0.75rem; opacity:.55;}\n.st{font-size:.7rem; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; display:inline-block;}\n.st.ok{background:#dbf3e7; color:var(--green);} .st.late{background:#f4dede; color:var(--red);} .st.pend{background:#fdecd4; color:#8a5c1e;}\n.st.pause{background:#eceef1; color:#54575f;} .st.cancel{background:#2b2b2e; color:#ff9a9a;}\n.cyc{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:0.85rem; flex-wrap:wrap;}\n.cyc .d{flex:1; min-width:150px;}\n.mgr-actions{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 18px;}\n.modal.wide{max-width:560px;}\n.note{font-size:0.75rem; opacity:.55; margin-top:10px; line-height:1.5;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003c!-- LOGIN SCREEN -->\n\u003cdiv class=\"login-screen\" id=\"login-screen\">\n  \u003cdiv class=\"login-card\">\n    \u003cimg src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAARsAAACTCAYAAAC+ub0gAACNo0lEQVR4nL29d6AlR3Ev/KuZOfdukFa7q4hQFiCBApJIAmQkMpZAIhqECTY2/vDDAQx+Jtjg58D7HPAzYDI2GGNMDiKIKCQhEMYIkABJCJRQWMXd1aYbzpmu74/u6q7q7pl7xXvfG+nuOWemQ3V11a+qq8PQZM0GpIsBUPpJAHF6oi8iym7mKQAQqfuE+Ct8kZqYOZVpLq6QFHNl1ftfrMrWz1XtoUiyJVBIw5zlq1yUaNBkZokq+QypqjiKPBi7JB1ljcvpZfPFPshvF/lWvM/qGQ08q3ItlcWhU2OyMp+pV/OG6mn87TofyXdrrdsqtAc5IKiyKONDhVOGkLw9lQo1MYVyIQmyLkZ+cJ0GHik2yk7MSSDisoBAGxEHtpPiv/SZKCXH5ymrSp/RTRFsJHVTbUeqDBzKsMpKNomlLRPKCqQY4DGYU5PflUBupPxazrpq3Lsyx6moqLICaw6/fT+y5UdWymrvaXGoUaPzaPmoXxVkKwxDLf1KXFffxwgYrUsXN9Tie3vZ3i15PFDHKqqu4k14UOVaxhqq3De6VzGYxTXAJk0Pc8Ug57SFTBrgxwxhY0ohaXGdVKpVlifQWUNxHP69t4JA5jsN1K+EgoZTlReDInCuno6he0O1UrQEK5TIHKVnrOy8pBpXeSDtYJ4Vu8V6u4PKP8JMiu3LPeJAwEodIflHUbFi/FYmbcWyTI0U/ymvoUoG8kTPoVaH/LH6OSBksb8ZBX+qJK3AbimCa/pBsNrMHPROOT2ViwB0NW9bM0A/T26t91VWHElVPEpLfKlcsX6x8GTTQt1LyG5LJUm0wtBkyIFKTPbIrqnMix2y4dpTs3eE+Dwt27JCRWTyrtCYX9Kory7bkBnOzKFh5Eq+QAahhrlVyVuJqsH66iWs6Dabu75JleeGF7bNufwOYdVqnLdIhAKh1RiW6lWRl5qfMeYZSxk8YCR1HQygK8XBuk4WcRlwAxVnZURwyUCGAxKmlKm+qGSF2NR7oiluK8q5dINteRWAkuexSkYarSerXKemTmcEQqVHSacsnJvcA8OpQbUowCsH0OFrZVXLKyKbKVaQW5chM5enUzyObjkrecAQ040BzOsg5sEYnqUx67sBC8ImT1ZMpW2Uu5C6upyHQ1qt5aZINyA76gmpHxUWGTCod5fVUBM6ybyRQl4zvjdlS7miiiiSrSSUFMgEU2JuzKuHMJX6xkxULHugXpI/G/sh2J4vhzfp+aqsjKJl6KoGK01943Vp70rS61YQcl74p/Lfypekh8qz2nwDP7XbOdi4Ae9AgXHOp8F8+jLKq7Vo3DfKPeOijF/2EmFUdcWxUESiCnBJPsFf1L0GpgrQCPtXoo1ROKJDCY3rUQNPW+xgYU3K5f9yYS6uUsJRY1rqJ1afVJnFKosvKh6KZ5D9I6o type=\"date\" id=\"f-prox-data\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>Motivo\u003c/label>\u003cinput type=\"text\" id=\"f-prox-motivo\" placeholder=\"Retornar or\u00e7amento\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn danger\" id=\"btn-delete\" style=\"display:none;\">Excluir\u003c/button>\n      \u003cdiv style=\"display:flex; gap:8px; margin-left:auto;\">\n        \u003cbutton class=\"btn ghost\" id=\"btn-cancel\">Cancelar\u003c/button>\n        \u003cbutton class=\"btn\" id=\"btn-save\">Salvar\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"overlay-tmpl\">\n  \u003cdiv class=\"modal\">\n    \u003ch3>Mensagens padr\u00e3o por situa\u00e7\u00e3o\u003c/h3>\n    \u003cdiv class=\"tmpl-field\">\n      \u003clabel>Or\u00e7amento enviado\u003c/label>\n      \u003ctextarea id=\"t-orc-env\">\u003c/textarea>\n    \u003c/div>\n    \u003cdiv class=\"tmpl-field\">\n      \u003clabel>Aguardando resposta\u003c/label>\n      \u003ctextarea id=\"t-aguard\">\u003c/textarea>\n    \u003c/div>\n    \u003cdiv class=\"tmpl-field\">\n      \u003clabel>Negocia\u00e7\u00e3o\u003c/label>\n      \u003ctextarea id=\"t-negoc\">\u003c/textarea>\n    \u003c/div>\n    \u003cdiv class=\"tmpl-field\">\n      \u003clabel>Sem contato h\u00e1 +30 dias (reativa\u00e7\u00e3o)\u003c/label>\n      \u003ctextarea id=\"t-reativ\">\u003c/textarea>\n    \u003c/div>\n    \u003cdiv class=\"tmpl-hint\">Use {nome}, {valor} e {empresa} \u2014 ser\u00e3o substitu\u00eddos automaticamente pelos dados de cada cliente.\u003c/div>\n    \u003cdiv class=\"modal-actions\">\n      \u003cdiv style=\"display:flex; gap:8px; margin-left:auto;\">\n        \u003cbutton class=\"btn ghost\" id=\"btn-tmpl-cancel\">Cancelar\u003c/button>\n        \u003cbutton class=\"btn\" id=\"btn-tmpl-save\">Salvar\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003c!-- /app-root -->\n\n\u003cdiv id=\"admin-root\" style=\"display:none;\">\n\u003caside class=\"sidebar\">\n  \u003cdiv class=\"brand\">\u003cimg id=\"admin-logo\" alt=\"Follow\">\u003c/div>\n  \u003cnav class=\"tabs\">\n    \u003cbutton class=\"active\" data-aview=\"assinantes\">Assinantes\u003c/button>\n    \u003cbutton data-aview=\"aconfig\">Configura\u00e7\u00f5es\u003c/button>\n  \u003c/nav>\n  \u003cdiv class=\"sidebar-foot\">Painel administrativo Follow\u003c/div>\n\u003c/aside>\n\u003cdiv style=\"flex:1; min-width:0;\">\n  \u003cdiv class=\"topbar\">\n    \u003cdiv class=\"crumb\">\u003cspan>Admin /\u003c/span>\u003cspan id=\"acrumb\">Assinantes\u003c/span>\u003c/div>\n    \u003cbutton class=\"logout-btn\" id=\"admin-logout\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"/>\u003cpolyline points=\"16 17 21 12 16 7\"/>\u003cline x1=\"21\" y1=\"12\" x2=\"9\" y2=\"12\"/>\u003c/svg>Sair\u003c/button>\n  \u003c/div>\n  \u003cmain>\u003cdiv class=\"content-wrap\">\n    \u003cdiv id=\"aview-assinantes\">\n      \u003cdiv class=\"hero-row\">\u003ch2>Assinantes\u003c/h2>\u003cdiv class=\"date mono\" id=\"a-today\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-grid\">\n        \u003cdiv class=\"stat\">\u003cdiv class=\"num\" id=\"as-ativos\">0\u003c/div>\u003cdiv class=\"label\">Acessos ativos\u003c/div>\u003c/div>\n        \u003cdiv class=\"stat\">\u003cdiv class=\"num\" id=\"as-late\">0\u003c/div>\u003cdiv class=\"label\">Em atraso\u003c/div>\u003c/div>\n        \u003cdiv class=\"stat\">\u003cdiv class=\"num\" id=\"as-pause\">0\u003c/div>\u003cdiv class=\"label\">Pausados\u003c/div>\u003c/div>\n        \u003cdiv class=\"stat\">\u003cdiv class=\"num\" id=\"as-mrr\">R$ 0\u003c/div>\u003cdiv class=\"label\">Receita mensal (ativos)\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"toolbar\">\n        \u003cinput type=\"text\" id=\"a-search\" placeholder=\"Buscar empresa ou e-mail\u2026\">\n        \u003cselect id=\"a-filter\">\u003coption value=\"\">Todos\u003c/option>\u003coption value=\"ativo\">Ativos\u003c/option>\u003coption value=\"late\">Em atraso\u003c/option>\u003coption value=\"pausado\">Pausados\u003c/option>\u003coption value=\"cancelado\">Cancelados\u003c/option>\u003c/select>\n        \u003cbutton class=\"btn\" id=\"a-new\">+ Novo acesso\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"twrap\">\u003ctable class=\"atable\">\u003cthead>\u003ctr>\u003cth>Empresa\u003c/th>\u003cth>Mensalidade\u003c/th>\u003cth>Criado em\u003c/th>\u003cth>Pr\u00f3x. vencimento\u003c/th>\u003cth>Acesso\u003c/th>\u003cth>Pagamento\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"a-body\">\u003c/tbody>\u003c/table>\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"aview-aconfig\" style=\"display:none;\">\n      \u003ch2 style=\"margin:0 0 4px; font-size:1.4rem; font-weight:800;\">Configura\u00e7\u00f5es\u003c/h2>\n      \u003cdiv class=\"cfg-sub\">Regras de cobran\u00e7a e acesso do administrador.\u003c/div>\n      \u003cdiv class=\"cfg-card\">\u003cdiv class=\"cfg-title\">Cobran\u00e7a\u003c/div>\u003cdiv class=\"cfg-desc\">Os vencimentos s\u00e3o contados a partir da data de cria\u00e7\u00e3o de cada acesso, todo m\u00eas.\u003c/div>\n        \u003cdiv class=\"field-row\">\u003cdiv class=\"field\">\u003clabel>Mensalidade padr\u00e3o (R$)\u003c/label>\u003cinput type=\"number\" id=\"ac-valor\" min=\"0\" step=\"0.01\">\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel>Bloquear ap\u00f3s (dias de atraso)\u003c/label>\u003cinput type=\"number\" id=\"ac-tol\" min=\"0\">\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"cfg-card\">\u003cdiv class=\"cfg-title\">Acesso do administrador\u003c/div>\u003cdiv class=\"cfg-desc\">Credenciais usadas para entrar neste painel.\u003c/div>\n        \u003cdiv class=\"field-row\">\u003cdiv class=\"field\">\u003clabel>E-mail\u003c/label>\u003cinput type=\"email\" id=\"ac-email\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>Senha\u003c/label>\u003cinput type=\"text\" id=\"ac-pass\">\u003c/div>\u003c/div>\u003c/div>\n      \u003cbutton class=\"btn\" id=\"ac-save\">Salvar configura\u00e7\u00f5es\u003c/button>\u003cspan class=\"cfg-saved\" id=\"ac-saved\">Configura\u00e7\u00f5es salvas.\u003c/span>\n      \u003cdiv class=\"note\">Prot\u00f3tipo: dados e senhas ficam salvos neste navegador. Na vers\u00e3o com Supabase o login usar\u00e1 Supabase Auth (senhas com hash) e os dados ir\u00e3o para o banco.\u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/main>\n\u003c/div>\n\u003cdiv class=\"overlay\" id=\"a-ov-edit\">\u003cdiv class=\"modal\">\n  \u003ch3 id=\"ae-title\">Novo acesso\u003c/h3>\u003cinput type=\"hidden\" id=\"ae-id\">\n  \u003cdiv class=\"field-row\">\u003cdiv class=\"field\">\u003clabel>Empresa\u003c/label>\u003cinput type=\"text\" id=\"ae-empresa\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>Respons\u00e1vel\u003c/label>\u003cinput type=\"text\" id=\"ae-nome\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"field-row\">\u003cdiv class=\"field\">\u003clabel>E-mail de acesso\u003c/label>\u003cinput type=\"email\" id=\"ae-email\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>Senha\u003c/label>\u003cinput type=\"text\" id=\"ae-senha\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"field-row\">\u003cdiv class=\"field\">\u003clabel>Mensalidade (R$)\u003c/label>\u003cinput type=\"number\" id=\"ae-valor\" min=\"0\" step=\"0.01\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>Data de cria\u00e7\u00e3o (base dos vencimentos)\u003c/label>\u003cinput type=\"date\" id=\"ae-inicio\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"login-error\" id=\"ae-err\" style=\"display:none; text-align:left;\">\u003c/div>\n  \u003cdiv class=\"modal-actions\">\u003cdiv>\u003c/div>\u003cdiv style=\"display:flex; gap:8px;\">\u003cbutton class=\"btn ghost\" id=\"ae-cancel\">Cancelar\u003c/button>\u003cbutton class=\"btn\" id=\"ae-save\">Salvar\u003c/button>\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"overlay\" id=\"a-ov-manage\">\u003cdiv class=\"modal wide\" id=\"a-manage\">\u003c/div>\u003c/div>\n\u003c/div>\u003c!-- /admin-root -->\n\n\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js\">\u003c/script>\n\u003cscript>\n/* ============================================================\n   FOLLOW \u2014 conectado ao Supabase\n   Preencha as duas linhas abaixo com os dados do seu projeto\n   (Project Settings \u2192 API, no painel do Supabase).\n   ============================================================ */\nconst SUPABASE_URL = 'https://gcfizjimktzdwzbpbdhp.supabase.co';\nconst SUPABASE_ANON_KEY = 'sb_publishable_qFMy39LT_3d0uENzWyETNQ_8FrtW-gu';\nif(!window.supabase){document.getElementById('login-error').textContent='N\u00e3o foi poss\u00edvel carregar a conex\u00e3o. Confira sua internet e recarregue a p\u00e1gina.';document.getElementById('login-error').style.display='block';throw new Error('Supabase indispon\u00edvel');}\nconst sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);\n\nfunction isoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}\nfunction todayStr(){ return isoLocal(new Date()); }\n\nconst DEFAULT_TEMPLATES = {\n  'orc-env': 'Oi {nome}! Passando pra confirmar se o or\u00e7amento de {valor} chegou certinho a\u00ed. Qualquer d\u00favida, me chama \ud83d\ude42',\n  'aguard': 'Oi {nome}, tudo bem? S\u00f3 retomando o contato sobre o or\u00e7amento de {valor} \u2014 ficou alguma d\u00favida ou posso ajustar algo pra fecharmos?',\n  'negoc': 'Oi {nome}! Vamos seguir com o or\u00e7amento de {valor}? Consigo te ajudar a fechar as condi\u00e7\u00f5es hoje, \u00e9 s\u00f3 me chamar.',\n  'reativ': 'Oi {nome}, tudo bem? Faz um tempo que n\u00e3o conversamos. Ainda faz sentido pra voc\u00ea aquele or\u00e7amento de {valor}? Se precisar de algo novo, \u00e9 s\u00f3 chamar!'\n};\nlet templates = {...DEFAULT_TEMPLATES};\nlet settings = {\n  scheduleTime: '09:00',\n  dias: ['seg','ter','qua','qui','sex'],\n  autoRetorno: true,\n  retorno1: 2,\n  retorno2: 5,\n  retorno3: 10,\n  cancelarAoMudar: true\n};\nlet sentToday = {}; // {clientId: 'YYYY-MM-DD'} \u2014 s\u00f3 neste navegador, n\u00e3o precisa ir pro banco\n\n/* ---------- BANCO: mapeamento client \u003c-> linha do Supabase ---------- */\nfunction dbToClient(r){\n  return { id:r.id, nome:r.nome, telefone:r.telefone, empresa:r.empresa, valor:r.valor,\n    origem:r.origem, situacao:r.situacao, proxData:r.prox_data, proxMotivo:r.prox_motivo,\n    retornoBase:r.retorno_base, retornoStage:r.retorno_stage };\n}\nfunction clientToDb(c){\n  return { nome:c.nome, telefone:c.telefone||null, empresa:c.empresa||null, valor:c.valor||0,\n    origem:c.origem||null, situacao:c.situacao, prox_data:c.proxData||null, prox_motivo:c.proxMotivo||null,\n    retorno_base:c.retornoBase||null, retorno_stage:c.retornoStage||0 };\n}\n\nlet currentTenantId = null;\n\nasync function loadClients(){\n  const { data, error } = await sb.from('clients').select('*').eq('tenant_id', currentTenantId);\n  clients = error ? [] : data.map(dbToClient);\n  if(error) console.error('loadClients', error);\n}\nasync function dbInsertClient(c){\n  const row = {...clientToDb(c), tenant_id: currentTenantId};\n  const { data, error } = await sb.from('clients').insert(row).select().single();\n  if(error){ alert('N\u00e3o foi poss\u00edvel salvar: '+error.message); return null; }\n  return dbToClient(data);\n}\nasync function dbUpdateClient(id, c){\n  const { data, error } = await sb.from('clients').update(clientToDb(c)).eq('id', id).select().single();\n  if(error){ alert('N\u00e3o foi poss\u00edvel salvar: '+error.message); return null; }\n  return dbToClient(data);\n}\nasync function dbDeleteClient(id){\n  const { error } = await sb.from('clients').delete().eq('id', id);\n  if(error) alert('N\u00e3o foi poss\u00edvel excluir: '+error.message);\n  return !error;\n}\n\nasync function loadTenantSettings(){\n  const { data, error } = await sb.from('tenant_settings').select('*').eq('tenant_id', currentTenantId).single();\n  if(error || !data) return;\n  settings = {\n    scheduleTime: data.schedule_time, dias: data.dias_envio, autoRetorno: data.auto_retorno,\n    retorno1: data.retorno1, retorno2: data.retorno2, retorno3: data.retorno3,\n    cancelarAoMudar: data.cancelar_ao_mudar\n  };\n  templates = {...DEFAULT_TEMPLATES, ...(data.templates||{})};\n}\nasync function saveSettings(){\n  await sb.from('tenant_settings').update({\n    schedule_time: settings.scheduleTime, dias_envio: settings.dias, auto_retorno: settings.autoRetorno,\n    retorno1: settings.retorno1, retorno2: settings.retorno2, retorno3: settings.retorno3,\n    cancelar_ao_mudar: settings.cancelarAoMudar\n  }).eq('tenant_id', currentTenantId);\n}\nasync function saveTemplates(){\n  await sb.from('tenant_settings').update({ templates }).eq('tenant_id', currentTenantId);\n}\n\nfunction loadSentToday(){\n  try{ sentToday = JSON.parse(localStorage.getItem('follow_sent_'+currentTenantId)||'{}'); }catch(e){ sentToday = {}; }\n}\nfunction saveSentToday(){\n  try{ localStorage.setItem('follow_sent_'+currentTenantId, JSON.stringify(sentToday)); }catch(e){}\n}\n\nfunction fillMessage(tmpl, c){\n  return tmpl\n    .replace(/{nome}/g, (c.nome||'').split(' ')[0])\n    .replace(/{valor}/g, fmtMoney(c.valor))\n    .replace(/{empresa}/g, c.empresa||'');\n}\nfunction templateFor(c){\n  if(c.proxData && daysDiff(c.proxData) \u003c -25) return templates['reativ'];\n  return templates[c.situacao] || templates['aguard'];\n}\n\nconst STATUS_LABEL = {\n  'novo':'Novo contato','orc-sol':'Or\u00e7amento solicitado','orc-env':'Or\u00e7amento enviado',\n  'aguard':'Aguardando resposta','negoc':'Negocia\u00e7\u00e3o','fechado':'Fechado','perdido':'Perdido'\n};\nconst FUNNEL_STAGES = ['novo','orc-env','aguard','negoc','fechado'];\nconst FUNNEL_LABEL = {'novo':'Novo','orc-env':'Or\u00e7amento','aguard':'Aguardando','negoc':'Negocia\u00e7\u00e3o','fechado':'Fechado'};\n\nlet clients = [];\n\nfunction daysDiff(dateStr){\n  const today = new Date(); today.setHours(0,0,0,0);\n  const target = new Date(dateStr+'T00:00:00');\n  return Math.round((target-today)/86400000);\n}\nfunction fmtMoney(v){\n  v = Number(v)||0;\n  return 'R$ ' + v.toLocaleString('pt-BR',{minimumFractionDigits:0, maximumFractionDigits:0});\n}\nfunction fmtDate(dateStr){\n  if(!dateStr) return '\u2014';\n  const [y,m,d] = dateStr.split('-');\n  return d+'/'+m;\n}\nfunction waLink(tel, nome){\n  const clean = (tel||'').replace(/\\D/g,'');\n  const text = encodeURIComponent('Ol\u00e1 '+ (nome?nome.split(' ')[0]:'') +', tudo bem?');\n  return 'https://wa.me/55'+clean+'?text='+text;\n}\n\n/* ---------- RENDER DASHBOARD ---------- */\nfunction renderDash(){\n  document.getElementById('today-date').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'});\n\n  const active = clients.filter(c=>c.situacao!=='fechado' && c.situacao!=='perdido');\n\n  const retornosHoje = active.filter(c=> c.proxData && daysDiff(c.proxData) \u003c= 0).length;\n  document.getElementById('s-retornos').textContent = retornosHoje;\n\n  const emNeg = clients.filter(c=>c.situacao==='negoc').reduce((s,c)=>s+(Number(c.valor)||0),0);\n  document.getElementById('s-emneg').textContent = fmtMoney(emNeg);\n\n  const orcEnv = clients.filter(c=>['orc-env','aguard'].includes(c.situacao)).length;\n  document.getElementById('s-orcenv').textContent = orcEnv;\n\n  const fechadosMes = clients.filter(c=>c.situacao==='fechado').length;\n  document.getElementById('s-fechados').textContent = fechadosMes;\n\n  document.getElementById('stat-retornos').onclick = ()=> filterAndShow('hoje');\n  document.getElementById('stat-emneg').onclick = ()=> filterAndShow('negoc');\n  document.getElementById('stat-orcenv').onclick = ()=> filterAndShow('enviados');\n  document.getElementById('stat-fechados').onclick = ()=> filterAndShow('fechados');\n\n  const atrasados = active.filter(c=>c.proxData && daysDiff(c.proxData) \u003c 0)\n    .sort((a,b)=>daysDiff(a.proxData)-daysDiff(b.proxData));\n  const hoje = active.filter(c=>c.proxData && daysDiff(c.proxData) === 0);\n  const semContato30 = active.filter(c=>c.proxData && daysDiff(c.proxData) \u003c -25);\n\n  const list = document.getElementById('attention-list');\n  list.innerHTML = '';\n  const rows = [];\n  if(atrasados.length) rows.push({dot:'red', text:atrasados.length+' retorno'+(atrasados.length>1?'s':'')+' atrasado'+(atrasados.length>1?'s':''), filter:()=>filterAndShow('atrasados')});\n  if(hoje.length) rows.push({dot:'yellow', text:hoje.length+' retorno'+(hoje.length>1?'s':'')+' para hoje', filter:()=>filterAndShow('hoje')});\n  const aguardando = clients.filter(c=>c.situacao==='aguard');\n  if(aguardando.length) rows.push({dot:'yellow', text:aguardando.length+' or\u00e7amento'+(aguardando.length>1?'s':'')+' aguardando resposta', filter:()=>filterAndShow('aguard')});\n  if(semContato30.length) rows.push({dot:'orange', text:semContato30.length+' cliente'+(semContato30.length>1?'s':'')+' sem contato h\u00e1 +30 dias', filter:()=>filterAndShow('sem30')});\n\n  if(rows.length===0){\n    list.innerHTML = '\u003cdiv class=\"arow\">\u003cdiv class=\"txt\" style=\"opacity:.6\">Tudo em dia. Nenhum retorno pendente.\u003c/div>\u003c/div>';\n  } else {\n    rows.forEach(r=>{\n      const el = document.createElement('div');\n      el.className='arow';\n      el.innerHTML = '\u003cspan class=\"dot '+r.dot+'\">\u003c/span>\u003cspan class=\"txt\">'+r.text+'\u003c/span>\u003cspan style=\"opacity:.4\">\u2192\u003c/span>';\n      el.onclick = r.filter;\n      list.appendChild(el);\n    });\n  }\n\n  const funnel = document.getElementById('funnel');\n  funnel.innerHTML='';\n  FUNNEL_STAGES.forEach(stage=>{\n    let count;\n    if(stage==='novo') count = clients.filter(c=>c.situacao==='novo'||c.situacao==='orc-sol').length;\n    else count = clients.filter(c=>c.situacao===stage).length;\n    const el = document.createElement('div');\n    el.className='stage';\n    el.innerHTML = '\u003cdiv class=\"n\">'+count+'\u003c/div>\u003cdiv class=\"l\">'+FUNNEL_LABEL[stage]+'\u003c/div>';\n    el.onclick = ()=> filterAndShow('funnel-'+stage);\n    funnel.appendChild(el);\n  });\n}\n\n/* ---------- CONFIG ---------- */\nfunction renderConfig(){\n  document.getElementById('cfg-schedule-time').value = settings.scheduleTime;\n  document.querySelectorAll('#dow-row button').forEach(b=>{\n    b.classList.toggle('on', settings.dias.includes(b.dataset.d));\n  });\n  document.getElementById('cfg-auto-retorno').checked = settings.autoRetorno;\n  document.getElementById('cfg-r1').value = settings.retorno1;\n  document.getElementById('cfg-r2').value = settings.retorno2;\n  document.getElementById('cfg-r3').value = settings.retorno3;\n  document.getElementById('cfg-cancelar').checked = settings.cancelarAoMudar;\n  document.getElementById('cfg-steps').style.opacity = settings.autoRetorno ? '1' : '0.4';\n  document.getElementById('cfg-saved-msg').classList.remove('show');\n}\n\ndocument.querySelectorAll('#dow-row button').forEach(b=>{\n  b.onclick = ()=> b.classList.toggle('on');\n});\ndocument.getElementById('cfg-auto-retorno').addEventListener('change', (e)=>{\n  document.getElementById('cfg-steps').style.opacity = e.target.checked ? '1' : '0.4';\n});\n\ndocument.getElementById('cfg-save').onclick = async ()=>{\n  settings.scheduleTime = document.getElementById('cfg-schedule-time').value || '09:00';\n  settings.dias = Array.from(document.querySelectorAll('#dow-row button.on')).map(b=>b.dataset.d);\n  settings.autoRetorno = document.getElementById('cfg-auto-retorno').checked;\n  settings.retorno1 = Number(document.getElementById('cfg-r1').value)||2;\n  settings.retorno2 = Number(document.getElementById('cfg-r2').value)||5;\n  settings.retorno3 = Number(document.getElementById('cfg-r3').value)||10;\n  settings.cancelarAoMudar = document.getElementById('cfg-cancelar').checked;\n  await saveSettings();\n  document.getElementById('cfg-saved-msg').classList.add('show');\n  setTimeout(()=> document.getElementById('cfg-saved-msg').classList.remove('show'), 2200);\n  checkBanner();\n};\n\nfunction addDaysSkippingOff(baseDateStr, days){\n  const DOW = ['dom','seg','ter','qua','qui','sex','sab'];\n  let d = new Date(baseDateStr+'T00:00:00');\n  d.setDate(d.getDate()+days);\n  if(settings.dias && settings.dias.length){\n    let guard = 0;\n    while(!settings.dias.includes(DOW[d.getDay()]) && guard\u003c14){ d.setDate(d.getDate()+1); guard++; }\n  }\n  return isoLocal(d);\n}\n\nfunction applyAutoRetorno(data, previous){\n  if(!settings.autoRetorno) return data;\n  const virouEnviado = data.situacao==='orc-env' && (!previous || previous.situacao!=='orc-env');\n  if(virouEnviado){\n    const base = todayStr();\n    data.proxData = addDaysSkippingOff(base, settings.retorno1);\n    data.proxMotivo = data.proxMotivo || 'Retornar or\u00e7amento (1\u00ba contato autom\u00e1tico)';\n    data.retornoBase = base;\n    data.retornoStage = 1;\n  }\n  if(settings.cancelarAoMudar && previous && previous.situacao!==data.situacao &&\n     ['negoc','fechado','perdido'].includes(data.situacao)){\n    data.retornoStage = 0;\n  }\n  return data;\n}\n\nfunction advanceRetorno(c){\n  if(!settings.autoRetorno || !c.retornoBase || !c.retornoStage) return false;\n  if(c.retornoStage===1){\n    c.proxData = addDaysSkippingOff(c.retornoBase, settings.retorno2);\n    c.proxMotivo = 'Retornar or\u00e7amento (2\u00ba contato autom\u00e1tico)';\n    c.retornoStage = 2;\n    return true;\n  } else if(c.retornoStage===2){\n    c.proxData = addDaysSkippingOff(c.retornoBase, settings.retorno3);\n    c.proxMotivo = 'Retornar or\u00e7amento (3\u00ba e \u00faltimo contato autom\u00e1tico)';\n    c.retornoStage = 3;\n    return true;\n  }\n  return false;\n}\nfunction filterAndShow(type){\n  pendingFilter = type;\n  switchView('list');\n}\n\n/* ---------- DISPARO ASSISTIDO ---------- */\nfunction dueForDisparo(){\n  return clients.filter(c=>{\n    if(c.situacao==='fechado' || c.situacao==='perdido') return false;\n    if(!c.proxData) return false;\n    return daysDiff(c.proxData) \u003c= 0;\n  }).sort((a,b)=>daysDiff(a.proxData)-daysDiff(b.proxData));\n}\n\nfunction renderDisparo(){\n  const due = dueForDisparo();\n  const done = due.filter(c=> sentToday[c.id]===todayStr());\n  document.getElementById('disparo-sub').textContent =\n    due.length===0\n      ? 'Nenhum or\u00e7amento pendente de retorno hoje.'\n      : done.length + ' de ' + due.length + ' mensagens enviadas hoje.';\n  document.getElementById('disparo-progress').style.width = due.length ? (done.length/due.length*100)+'%' : '0%';\n  document.getElementById('schedule-time').value = settings.scheduleTime;\n\n  const list = document.getElementById('disparo-list');\n  list.innerHTML = '';\n  if(due.length===0){\n    list.innerHTML = '\u003cdiv class=\"empty\">Tudo enviado. Nenhum or\u00e7amento programado para hoje.\u003c/div>';\n    return;\n  }\n  due.forEach(c=>{\n    const isSent = sentToday[c.id]===todayStr();\n    const isLate = daysDiff(c.proxData) \u003c 0;\n    const card = document.createElement('div');\n    card.className = 'send-card' + (isSent?' sent':'');\n    const msg = fillMessage(templateFor(c), c);\n    card.innerHTML = `\n      \u003cdiv class=\"top-row\">\n        \u003cdiv class=\"who-info\">\n          \u003cdiv class=\"name\">${escapeHtml(c.nome)} ${isLate?'\u003cspan class=\"tag-late\">atrasado\u003c/span>':''} ${isSent?'\u003cspan class=\"tag-done\">enviado\u003c/span>':''}\u003c/div>\n          \u003cdiv class=\"meta\">${fmtMoney(c.valor)} \u00b7 ${escapeHtml(c.proxMotivo||STATUS_LABEL[c.situacao])}\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003ctextarea data-id=\"${c.id}\">${msg}\u003c/textarea>\n      \u003cdiv class=\"bottom-row\">\n        \u003cbutton class=\"btn ghost small\" data-act=\"skip\">Marcar como enviado\u003c/button>\n        \u003cbutton class=\"btn small\" data-act=\"send\">Enviar pelo WhatsApp\u003c/button>\n      \u003c/div>\n    `;\n    async function markSent(){\n      sentToday[c.id] = todayStr();\n      saveSentToday();\n      if(advanceRetorno(c)) await dbUpdateClient(c.id, c);\n      renderDisparo();\n      renderDash();\n    }\n    card.querySelector('[data-act=\"send\"]').onclick = ()=>{\n      const text = card.querySelector('textarea').value;\n      window.open('https://wa.me/55'+(c.telefone||'').replace(/\\D/g,'')+'?text='+encodeURIComponent(text), '_blank');\n      markSent();\n    };\n    card.querySelector('[data-act=\"skip\"]').onclick = markSent;\n    list.appendChild(card);\n  });\n}\n\nfunction checkBanner(){\n  const banner = document.getElementById('banner');\n  const now = new Date();\n  const [h,m] = settings.scheduleTime.split(':').map(Number);\n  const scheduled = new Date(); scheduled.setHours(h,m,0,0);\n  const due = dueForDisparo();\n  const pendentes = due.filter(c=> sentToday[c.id]!==todayStr());\n\n  if(now >= scheduled && pendentes.length > 0){\n    banner.style.display = '';\n    document.getElementById('banner-inner').innerHTML =\n      '\u003cspan>\ud83d\udd14\u003c/span>\u003cspan class=\"t\">S\u00e3o '+settings.scheduleTime+' \u2014 '+pendentes.length+' or\u00e7amento'+(pendentes.length>1?'s':'')+' com retorno programado'+(pendentes.length>1?'s':'')+' para hoje\u003c/span>\u003cspan class=\"arrow\">\u2192\u003c/span>';\n    document.getElementById('banner-inner').onclick = ()=> switchView('disparo');\n  } else {\n    banner.style.display = 'none';\n  }\n}\n\ndocument.getElementById('schedule-time').addEventListener('change', async (e)=>{\n  settings.scheduleTime = e.target.value;\n  await saveSettings();\n  checkBanner();\n});\n\nconst overlayTmpl = document.getElementById('overlay-tmpl');\ndocument.getElementById('btn-templates').onclick = ()=>{\n  document.getElementById('t-orc-env').value = templates['orc-env'];\n  document.getElementById('t-aguard').value = templates['aguard'];\n  document.getElementById('t-negoc').value = templates['negoc'];\n  document.getElementById('t-reativ').value = templates['reativ'];\n  overlayTmpl.classList.add('show');\n};\ndocument.getElementById('btn-tmpl-cancel').onclick = ()=> overlayTmpl.classList.remove('show');\noverlayTmpl.onclick = (e)=>{ if(e.target===overlayTmpl) overlayTmpl.classList.remove('show'); };\ndocument.getElementById('btn-tmpl-save').onclick = async ()=>{\n  templates['orc-env'] = document.getElementById('t-orc-env').value;\n  templates['aguard'] = document.getElementById('t-aguard').value;\n  templates['negoc'] = document.getElementById('t-negoc').value;\n  templates['reativ'] = document.getElementById('t-reativ').value;\n  await saveTemplates();\n  overlayTmpl.classList.remove('show');\n  renderDisparo();\n};\n\n/* ---------- RENDER LIST ---------- */\nfunction renderList(){\n  const search = document.getElementById('search').value.trim().toLowerCase();\n  const statusFilter = document.getElementById('filter-status').value;\n  const container = document.getElementById('client-list');\n\n  let items = clients.slice();\n\n  if(pendingFilter==='atrasados') items = items.filter(c=>c.proxData && daysDiff(c.proxData)\u003c0 && c.situacao!=='fechado' && c.situacao!=='perdido');\n  else if(pendingFilter==='hoje') items = items.filter(c=>c.proxData && daysDiff(c.proxData)===0 && c.situacao!=='fechado' && c.situacao!=='perdido');\n  else if(pendingFilter==='aguard') items = items.filter(c=>c.situacao==='aguard');\n  else if(pendingFilter==='sem30') items = items.filter(c=>c.proxData && daysDiff(c.proxData)\u003c-25 && c.situacao!=='fechado' && c.situacao!=='perdido');\n  else if(pendingFilter==='negoc') items = items.filter(c=>c.situacao==='negoc');\n  else if(pendingFilter==='enviados') items = items.filter(c=>['orc-env','aguard'].includes(c.situacao));\n  else if(pendingFilter==='fechados') items = items.filter(c=>c.situacao==='fechado');\n  else if(pendingFilter==='funnel-novo') items = items.filter(c=>['novo','orc-sol'].includes(c.situacao));\n  else if(pendingFilter==='funnel-orc-env') items = items.filter(c=>c.situacao==='orc-env');\n  else if(pendingFilter==='funnel-aguard') items = items.filter(c=>c.situacao==='aguard');\n  else if(pendingFilter==='funnel-negoc') items = items.filter(c=>c.situacao==='negoc');\n  else if(pendingFilter==='funnel-fechado') items = items.filter(c=>c.situacao==='fechado');\n\n  if(search){\n    items = items.filter(c=> (c.nome||'').toLowerCase().includes(search) || (c.empresa||'').toLowerCase().includes(search));\n  }\n  if(statusFilter){\n    items = items.filter(c=>c.situacao===statusFilter);\n  }\n\n  items.sort((a,b)=>{\n    const da = a.proxData? daysDiff(a.proxData) : 9999;\n    const db = b.proxData? daysDiff(b.proxData) : 9999;\n    return da-db;\n  });\n\n  container.innerHTML='';\n  if(items.length===0){\n    container.innerHTML = '\u003cdiv class=\"empty\">Nenhum cliente encontrado.\u003c/div>';\n    return;\n  }\n\n  items.forEach(c=>{\n    const card = document.createElement('div');\n    card.className='client-card';\n    let dClass='', dText='\u2014';\n    if(c.proxData){\n      const diff = daysDiff(c.proxData);\n      dText = fmtDate(c.proxData);\n      if(diff\u003c0){ dClass='late'; dText = fmtDate(c.proxData)+' \u00b7 atrasado'; }\n      else if(diff===0){ dClass='today'; dText='Hoje'; }\n    }\n    card.innerHTML = `\n      \u003cdiv class=\"who\">\n        \u003cdiv class=\"name\">${escapeHtml(c.nome||'\u2014')}\u003c/div>\n        \u003cdiv class=\"co\">${escapeHtml(c.empresa||c.origem||'')}\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"val\">${fmtMoney(c.valor)}\u003c/div>\n      \u003cspan class=\"pill ${c.situacao}\">${STATUS_LABEL[c.situacao]||c.situacao}\u003c/span>\n      \u003cdiv class=\"next-info\">\n        \u003cdiv class=\"lbl\">${escapeHtml(c.proxMotivo||'Pr\u00f3ximo contato')}\u003c/div>\n        \u003cdiv class=\"d ${dClass}\">${dText}\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"actions\">\n        \u003cbutton class=\"wa\" title=\"Abrir WhatsApp\" data-act=\"wa\">\n          \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"white\">\u003cpath d=\"M17.6 6.3A8.86 8.86 0 0 0 12 3.9C7.3 3.9 3.5 7.7 3.5 12.4c0 1.5.4 2.9 1.1 4.2L3.4 21l4.5-1.2c1.2.7 2.6 1 4.1 1 4.7 0 8.5-3.8 8.5-8.5 0-2.3-.9-4.4-2.5-6zM12 19.4c-1.3 0-2.6-.4-3.7-1l-.3-.2-2.7.7.7-2.6-.2-.3c-.7-1.1-1.1-2.4-1.1-3.7 0-3.9 3.2-7 7-7 1.9 0 3.6.7 4.9 2 1.3 1.3 2 3 2 4.9.1 3.9-3.1 7.2-6.6 7.2zm3.9-5.2c-.2-.1-1.3-.6-1.5-.7-.2-.1-.3-.1-.5.1-.1.2-.5.7-.6.8-.1.1-.2.2-.4.1-.2-.1-.8-.3-1.6-1-.6-.5-1-1.2-1.1-1.4-.1-.2 0-.3.1-.4.1-.1.2-.2.3-.4.1-.1.1-.2.2-.4.1-.1 0-.3 0-.4-.1-.1-.5-1.3-.7-1.7-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2 1 2.4c.1.1 1.6 2.5 3.9 3.4 1.4.6 2 .6 2.6.5.4-.1 1.3-.5 1.4-1 .2-.5.2-1 .1-1.1z\"/>\u003c/svg>\n        \u003c/button>\n        \u003cbutton class=\"icon-btn\" data-act=\"edit\">\u270e\u003c/button>\n      \u003c/div>\n    `;\n    card.querySelector('[data-act=\"wa\"]').onclick = (e)=>{ e.stopPropagation(); window.open(waLink(c.telefone,c.nome),'_blank'); };\n    card.querySelector('[data-act=\"edit\"]').onclick = (e)=>{ e.stopPropagation(); openModal(c); };\n    container.appendChild(card);\n  });\n}\n\nfunction escapeHtml(s){ return (s||'').replace(/[&\u003c>\"']/g, m=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m])); }\n\n/* ---------- VIEW SWITCH ---------- */\nlet pendingFilter = null;\nfunction switchView(view){\n  document.getElementById('view-dash').style.display = view==='dash' ? '' : 'none';\n  document.getElementById('view-list').style.display = view==='list' ? '' : 'none';\n  document.getElementById('view-disparo').style.display = view==='disparo' ? '' : 'none';\n  document.getElementById('view-config').style.display = view==='config' ? '' : 'none';\n  document.querySelectorAll('#app-root nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));\n  const crumbLabels = {dash:'Hoje', list:'Clientes', disparo:'Disparo', config:'Configura\u00e7\u00f5es'};\n  document.getElementById('crumb-view').textContent = crumbLabels[view] || view;\n  if(view==='dash'){ pendingFilter=null; renderDash(); }\n  if(view==='list'){ renderList(); }\n  if(view==='disparo'){ renderDisparo(); }\n  if(view==='config'){ renderConfig(); }\n}\ndocument.querySelectorAll('#app-root nav.tabs button').forEach(b=>{\n  b.onclick = ()=> switchView(b.dataset.view);\n});\ndocument.getElementById('search').oninput = renderList;\ndocument.getElementById('filter-status').onchange = ()=>{ pendingFilter=null; renderList(); };\n\n/* ---------- MODAL cliente ---------- */\nconst overlay = document.getElementById('overlay');\nfunction openModal(client){\n  document.getElementById('modal-title').textContent = client ? 'Editar cliente' : 'Novo cliente';\n  document.getElementById('f-id').value = client ? client.id : '';\n  document.getElementById('f-nome').value = client ? client.nome : '';\n  document.getElementById('f-telefone').value = client ? client.telefone : '';\n  document.getElementById('f-empresa').value = client ? client.empresa : '';\n  document.getElementById('f-valor').value = client ? client.valor : '';\n  document.getElementById('f-origem').value = client ? client.origem : '';\n  document.getElementById('f-situacao').value = client ? client.situacao : 'novo';\n  document.getElementById('f-prox-data').value = client ? client.proxData : '';\n  document.getElementById('f-prox-motivo').value = client ? client.proxMotivo : '';\n  document.getElementById('btn-delete').style.display = client ? '' : 'none';\n  overlay.classList.add('show');\n}\nfunction closeModal(){ overlay.classList.remove('show'); }\ndocument.getElementById('btn-new').onclick = ()=> openModal(null);\ndocument.getElementById('btn-cancel').onclick = closeModal;\noverlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };\n\ndocument.getElementById('btn-save').onclick = async ()=>{\n  const id = document.getElementById('f-id').value;\n  const nome = document.getElementById('f-nome').value.trim();\n  if(!nome){ alert('Informe o nome do cliente.'); return; }\n  let data = {\n    nome,\n    telefone: document.getElementById('f-telefone').value.trim(),\n    empresa: document.getElementById('f-empresa').value.trim(),\n    valor: Number(document.getElementById('f-valor').value)||0,\n    origem: document.getElementById('f-origem').value.trim(),\n    situacao: document.getElementById('f-situacao').value,\n    proxData: document.getElementById('f-prox-data').value,\n    proxMotivo: document.getElementById('f-prox-motivo').value.trim(),\n  };\n  const btn = document.getElementById('btn-save'); btn.disabled = true;\n  if(id){\n    const idx = clients.findIndex(c=>c.id===id);\n    const previous = clients[idx];\n    data = applyAutoRetorno({...previous, ...data}, previous);\n    const merged = {...previous, ...data};\n    const saved = await dbUpdateClient(id, merged);\n    if(saved) clients[idx] = saved;\n  } else {\n    data = applyAutoRetorno({...data, retornoStage:0}, null);\n    const saved = await dbInsertClient(data);\n    if(saved) clients.push(saved);\n  }\n  btn.disabled = false;\n  closeModal();\n  renderDash();\n  renderList();\n};\n\ndocument.getElementById('btn-delete').onclick = async ()=>{\n  const id = document.getElementById('f-id').value;\n  if(id && confirm('Excluir este cliente?')){\n    const ok = await dbDeleteClient(id);\n    if(ok) clients = clients.filter(c=>c.id!==id);\n    closeModal();\n    renderDash();\n    renderList();\n  }\n};\n\nfunction updateDisparoBadge(){\n  const due = dueForDisparo();\n  const pendentes = due.filter(c=> sentToday[c.id]!==todayStr());\n  const badge = document.getElementById('disparo-badge');\n  if(pendentes.length){ badge.textContent = pendentes.length; badge.style.display=''; }\n  else { badge.style.display='none'; }\n}\n\n/* ============================================================\n   SESS\u00c3O / LOGIN \u2014 Supabase Auth\n   ============================================================ */\nlet sessionRole = null;\nlet currentUser = null;\n\nfunction showScreen(w){\n  if(w==='login'||w==='admin')window.parent.postMessage({type:'follow-auth-screen'},'*');\n  document.getElementById('login-screen').style.display = w==='login' ? 'flex' : 'none';\n  document.getElementById('app-root').style.display = w==='app' ? '' : 'none';\n  document.getElementById('admin-root').style.display = w==='admin' ? '' : 'none';\n}\nfunction loginError(msg){ const e=document.getElementById('login-error'); e.textContent=msg; e.style.display=msg?'block':'none'; }\nfunction setLoading(is){ const b=document.getElementById('login-submit'); b.disabled=is; b.textContent = is ? 'Entrando\u2026' : 'Entrar'; }\n\n/* datas / financeiro (mesma l\u00f3gica usada no prot\u00f3tipo, agora alimentada pelo banco) */\nfunction addDaysIso(s,n){ const p=s.split('-').map(Number); return isoLocal(new Date(p[0],p[1]-1,p[2]+n)); }\nfunction addMonthsIso(s,n){ const p=s.split('-').map(Number); const f=new Date(p[0],p[1]-1+n,1); const dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate(); return isoLocal(new Date(f.getFullYear(),f.getMonth(),Math.min(p[2],dim))); }\nfunction daysBetweenIso(a,b){ const x=a.split('-').map(Number), y=b.split('-').map(Number); return Math.round((new Date(y[0],y[1]-1,y[2])-new Date(x[0],x[1]-1,x[2]))/86400000); }\nfunction fmtFull(s){ if(!s) return '\u2014'; const p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }\nfunction fmtBRL(v){ return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }\n\nfunction tenantRowToAccount(t, payments){\n  const pagos = {};\n  payments.filter(p=>p.tenant_id===t.id).forEach(p=> pagos[p.ciclo] = p.pago_em);\n  return { id:t.id, empresa:t.empresa, nome:t.nome_responsavel, email:t.email, valor:t.valor_mensal,\n    criado:t.criado_em, anchor:t.ancora, status:t.status, pausedAt:t.pausado_em, cancelledAt:t.cancelado_em,\n    authUserId:t.auth_user_id, pagos };\n}\nfunction aCycles(a){\n  const t=todayStr(); const ref=a.status==='cancelado'?a.cancelledAt:(a.status==='pausado'?a.pausedAt:t);\n  const out=[]; let n=0;\n  while(n\u003c240){ const due=addMonthsIso(a.anchor,n); if(due>ref) break; out.push({n,due,paidAt:a.pagos[n]||null}); n++; }\n  if(a.status==='ativo'){ out.push({n,due:addMonthsIso(a.anchor,n),paidAt:a.pagos[n]||null,future:true}); }\n  return out;\n}\nfunction aFinance(a){\n  const t=todayStr(); const cs=aCycles(a);\n  const late=cs.filter(c=>!c.paidAt && c.due\u003ct); const today=cs.filter(c=>!c.paidAt && c.due===t);\n  const next=cs.find(c=>!c.paidAt && c.due>=t)||null;\n  if(late.length) return {state:'late',daysLate:daysBetweenIso(late[0].due,t),next:late[0],cs};\n  if(today.length) return {state:'pend',daysLate:0,next:today[0],cs};\n  return {state:'ok',daysLate:0,next,cs};\n}\nfunction aAccess(a){\n  if(a.status==='cancelado') return {ok:false,reason:'Assinatura cancelada. Fale com o suporte para reativar.'};\n  if(a.status==='pausado') return {ok:false,reason:'Acesso pausado. Fale com o suporte para retomar.'};\n  const f=aFinance(a); if(f.state==='late' && f.daysLate>A.cfg.tolerancia) return {ok:false,reason:'Acesso bloqueado por pagamento em atraso. Regularize para voltar a usar.'};\n  return {ok:true};\n}\n\nasync function bootTenant(acc){\n  sessionRole='tenant'; currentTenantId=acc.id;\n  window.parent.postMessage({type:'follow-auth-tenant',tenantId:acc.id,company:acc.empresa},'*');\n}\nasync function bootAdmin(){\n  sessionRole='admin';\n  document.getElementById('admin-logo').src=document.querySelector('#app-root .brand img').src;\n  await aLoadFromDb();\n  showScreen('admin'); aSwitch('assinantes');\n}\n\nasync function doLogin(){\n  const email=document.getElementById('login-email').value.trim();\n  const pass=document.getElementById('login-password').value;\n  if(!email||!pass){ loginError('Preencha e-mail e senha.'); return; }\n  setLoading(true); loginError('');\n  try {\n  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });\n  if(error){ setLoading(false); loginError('E-mail ou senha inv\u00e1lidos.'); return; }\n  await resolveSession(data.user);\n  } catch(e) { loginError('N\u00e3o foi poss\u00edvel conectar. Confira sua internet e tente novamente.'); } finally {setLoading(false);}\n}\nasync function resolveSession(user){\n  currentUser = user;\n  const { data: adminRow } = await sb.from('app_admins').select('auth_user_id').eq('auth_user_id', user.id).maybeSingle();\n  if(adminRow){ await bootAdmin(); return; }\n\n  const { data: tenantRow } = await sb.from('tenants').select('*').eq('auth_user_id', user.id).maybeSingle();\n  if(!tenantRow){ loginError('Este login n\u00e3o est\u00e1 associado a nenhuma conta.'); await sb.auth.signOut(); return; }\n\n  const { data: payRows } = await sb.from('tenant_payments').select('*').eq('tenant_id', tenantRow.id);\n  const { data: cfgRow } = await sb.from('app_config').select('*').maybeSingle();\n  A.cfg = cfgRow ? {valorPadrao:cfgRow.valor_padrao, tolerancia:cfgRow.tolerancia_dias} : {valorPadrao:99, tolerancia:5};\n\n  const acc = tenantRowToAccount(tenantRow, payRows||[]);\n  const ac = aAccess(acc);\n  if(!ac.ok){ loginError(ac.reason); await sb.auth.signOut(); return; }\n  await bootTenant(acc);\n}\nasync function doLogout(){\n  await sb.auth.signOut();\n  sessionRole=null; currentUser=null;\n  document.getElementById('login-password').value=''; loginError('');\n  showScreen('login');\n}\ndocument.getElementById('login-submit').onclick=doLogin;\n['login-email','login-password'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); }));\ndocument.getElementById('logout-btn').onclick=doLogout;\ndocument.getElementById('admin-logout').onclick=doLogout;\n\n/* ============================================================\n   ADMIN \u2014 assinaturas, tudo vindo do Supabase\n   ============================================================ */\nlet A = { cfg:{valorPadrao:99, tolerancia:5}, accounts:[] };\n\nasync function aLoadFromDb(){\n  const [{data:tRows},{data:pRows},{data:cfgRow}] = await Promise.all([\n    sb.from('tenants').select('*').order('created_at',{ascending:false}),\n    sb.from('tenant_payments').select('*'),\n    sb.from('app_config').select('*').maybeSingle()\n  ]);\n  A.cfg = cfgRow ? {valorPadrao:cfgRow.valor_padrao, tolerancia:cfgRow.tolerancia_dias} : {valorPadrao:99, tolerancia:5};\n  A.accounts = (tRows||[]).map(t=>tenantRowToAccount(t, pRows||[]));\n}\n\nfunction aSwitch(v){\n  ['assinantes','aconfig'].forEach(x=>document.getElementById('aview-'+x).style.display=x===v?'':'none');\n  document.querySelectorAll('#admin-root nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.aview===v));\n  document.getElementById('acrumb').textContent=v==='assinantes'?'Assinantes':'Configura\u00e7\u00f5es';\n  if(v==='assinantes') renderAdmin(); else renderAConfig();\n}\ndocument.querySelectorAll('#admin-root nav.tabs button').forEach(b=>b.onclick=()=>aSwitch(b.dataset.aview));\n\nfunction payBadge(a){\n  if(a.status==='cancelado') return '\u003cspan class=\"st cancel\">\u2014\u003c/span>';\n  const f=aFinance(a);\n  if(f.state==='late') return '\u003cspan class=\"st late\">Atrasado '+f.daysLate+'d\u003c/span>';\n  if(f.state==='pend') return '\u003cspan class=\"st pend\">Vence hoje\u003c/span>';\n  return '\u003cspan class=\"st ok\">Em dia\u003c/span>';\n}\nfunction accBadge(a){\n  if(a.status==='cancelado') return '\u003cspan class=\"st cancel\">Cancelado\u003c/span>';\n  if(a.status==='pausado') return '\u003cspan class=\"st pause\">Pausado\u003c/span>';\n  return aAccess(a).ok ? '\u003cspan class=\"st ok\">Liberado\u003c/span>' : '\u003cspan class=\"st late\">Bloqueado\u003c/span>';\n}\nfunction renderAdmin(){\n  document.getElementById('a-today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});\n  const L=A.accounts;\n  document.getElementById('as-ativos').textContent=L.filter(a=>a.status==='ativo').length;\n  document.getElementById('as-late').textContent=L.filter(a=>a.status!=='cancelado' && aFinance(a).state==='late').length;\n  document.getElementById('as-pause').textContent=L.filter(a=>a.status==='pausado').length;\n  document.getElementById('as-mrr').textContent=fmtBRL(L.filter(a=>a.status==='ativo').reduce((s,a)=>s+Number(a.valor||0),0));\n  const q=document.getElementById('a-search').value.trim().toLowerCase(); const f=document.getElementById('a-filter').value;\n  const rows=L.filter(a=>{\n    if(q && !(a.empresa+' '+a.email+' '+(a.nome||'')).toLowerCase().includes(q)) return false;\n    if(f==='late') return a.status!=='cancelado' && aFinance(a).state==='late';\n    if(f) return a.status===f; return true;\n  });\n  const body=document.getElementById('a-body');\n  if(!rows.length){ body.innerHTML='\u003ctr>\u003ctd colspan=\"7\">\u003cdiv class=\"empty\" style=\"border:none\">Nenhum acesso encontrado.\u003c/div>\u003c/td>\u003c/tr>'; return; }\n  body.innerHTML=rows.map(a=>{ const fi=aFinance(a); return '\u003ctr>\u003ctd>\u003cb>'+escapeHtml(a.empresa)+'\u003c/b>\u003cdiv class=\"sub\">'+escapeHtml(a.email)+'\u003c/div>\u003c/td>\u003ctd class=\"mono\">'+fmtBRL(a.valor)+'\u003c/td>\u003ctd>'+fmtFull(a.criado)+'\u003c/td>\u003ctd>'+(a.status==='ativo'&&fi.next?fmtFull(fi.next.due):'\u2014')+'\u003c/td>\u003ctd>'+accBadge(a)+'\u003c/td>\u003ctd>'+payBadge(a)+'\u003c/td>\u003ctd>\u003cbutton class=\"btn ghost small\" data-manage=\"'+a.id+'\">Gerenciar\u003c/button>\u003c/td>\u003c/tr>'; }).join('');\n}\ndocument.getElementById('a-search').oninput=renderAdmin;\ndocument.getElementById('a-filter').onchange=renderAdmin;\ndocument.getElementById('a-body').onclick=e=>{ const b=e.target.closest('[data-manage]'); if(b) openManage(b.dataset.manage); };\n\n/* chamada \u00e0s Edge Functions (precisam da Service Role Key, por isso rodam no servidor) */\nasync function callFn(name, body){\n  const { data, error } = await sb.functions.invoke(name, { body });\n  if(error){ return { error: error.message || String(error) }; }\n  return data;\n}\n\nfunction openAEdit(id){\n  const a=id?A.accounts.find(x=>x.id===id):null;\n  document.getElementById('ae-title').textContent=a?'Editar acesso':'Novo acesso';\n  document.getElementById('ae-id').value=a?a.id:'';\n  document.getElementById('ae-empresa').value=a?a.empresa:''; document.getElementById('ae-nome').value=a?(a.nome||''):'';\n  document.getElementById('ae-email').value=a?a.email:''; document.getElementById('ae-senha').value='';\n  document.getElementById('ae-senha').placeholder = a ? 'deixe em branco para manter a atual' : '\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022';\n  document.getElementById('ae-valor').value=a?a.valor:A.cfg.valorPadrao;\n  const ini=document.getElementById('ae-inicio'); ini.value=a?a.criado:todayStr(); ini.disabled=!!a;\n  document.getElementById('ae-err').style.display='none';\n  document.getElementById('a-ov-manage').classList.remove('show'); document.getElementById('a-ov-edit').classList.add('show');\n}\ndocument.getElementById('a-new').onclick=()=>openAEdit(null);\ndocument.getElementById('ae-cancel').onclick=()=>document.getElementById('a-ov-edit').classList.remove('show');\ndocument.getElementById('ae-save').onclick=async ()=>{\n  const id=document.getElementById('ae-id').value; const g=x=>document.getElementById(x).value.trim();\n  const empresa=g('ae-empresa'), nome=g('ae-nome'), email=g('ae-email'), senha=g('ae-senha'), valor=Number(g('ae-valor'))||0;\n  const err=m=>{ const e=document.getElementById('ae-err'); e.textContent=m; e.style.display='block'; };\n  if(!empresa||!email) return err('Preencha empresa e e-mail.');\n  const btn=document.getElementById('ae-save'); btn.disabled=true;\n\n  if(id){\n    // dados normais: update direto na tabela\n    const { error } = await sb.from('tenants').update({ empresa, nome_responsavel:nome||null, valor_mensal:valor }).eq('id', id);\n    if(error){ btn.disabled=false; return err(error.message); }\n    // e-mail/senha exigem a Service Role Key -> Edge Function\n    if(senha || email!==A.accounts.find(x=>x.id===id).email){\n      const r = await callFn('manage-tenant', { action:'update_credentials', tenant_id:id, email, senha:senha||undefined });\n      if(r.error){ btn.disabled=false; return err(r.error); }\n    }\n  } else {\n    if(!senha) { btn.disabled=false; return err('Defina uma senha para o novo acesso.'); }\n    const r = await callFn('create-tenant', { empresa, nome_responsavel:nome, email, senha, valor_mensal:valor, criado_em:g('ae-inicio')||todayStr() });\n    if(r.error){ btn.disabled=false; return err(r.error); }\n  }\n  btn.disabled=false;\n  await aLoadFromDb();\n  document.getElementById('a-ov-edit').classList.remove('show'); renderAdmin();\n};\n\nfunction openManage(id){\n  const a=A.accounts.find(x=>x.id===id); if(!a) return;\n  const f=aFinance(a); const el=document.getElementById('a-manage');\n  const btns=[];\n  if(a.status==='ativo') btns.push('\u003cbutton class=\"btn ghost small\" data-act=\"pause\">Pausar\u003c/button>');\n  if(a.status==='pausado') btns.push('\u003cbutton class=\"btn small\" data-act=\"resume\">Retomar\u003c/button>');\n  if(a.status==='cancelado') btns.push('\u003cbutton class=\"btn small\" data-act=\"reactivate\">Reativar assinatura\u003c/button>');\n  if(a.status!=='cancelado') btns.push('\u003cbutton class=\"btn danger small\" data-act=\"cancel\">Cancelar assinatura\u003c/button>');\n  btns.push('\u003cbutton class=\"btn ghost small\" data-act=\"edit\">Editar / senha\u003c/button>');\n  btns.push('\u003cbutton class=\"btn ghost small\" data-act=\"del\">Excluir\u003c/button>');\n  const cyc=f.cs.slice().reverse().map(c=>{\n    let st, act='';\n    if(c.paidAt){ st='\u003cspan class=\"st ok\">Pago em '+fmtFull(c.paidAt)+'\u003c/span>'; act='\u003cbutton class=\"btn ghost small\" data-act=\"unpay\" data-n=\"'+c.n+'\">Desfazer\u003c/button>'; }\n    else { const late=c.due\u003ctodayStr(); st=late?'\u003cspan class=\"st late\">Atrasado '+daysBetweenIso(c.due,todayStr())+'d\u003c/span>':(c.due===todayStr()?'\u003cspan class=\"st pend\">Vence hoje\u003c/span>':'\u003cspan class=\"st pause\">A vencer\u003c/span>'); act='\u003cbutton class=\"btn small\" data-act=\"pay\" data-n=\"'+c.n+'\">Dar baixa\u003c/button>'; }\n    return '\u003cdiv class=\"cyc\">\u003cdiv class=\"d\">\u003cb>Mensalidade '+(c.n+1)+'\u003c/b>\u003cdiv class=\"sub\" style=\"font-size:.75rem;opacity:.55\">Vence '+fmtFull(c.due)+' \u00b7 '+fmtBRL(a.valor)+'\u003c/div>\u003c/div>'+st+act+'\u003c/div>';\n  }).join('') || '\u003cdiv class=\"empty\">Nenhuma mensalidade gerada.\u003c/div>';\n  el.dataset.id=id;\n  el.innerHTML='\u003ch3 style=\"margin-bottom:4px\">'+escapeHtml(a.empresa)+'\u003c/h3>\u003cdiv class=\"sub\" style=\"font-size:.8rem;opacity:.6\">'+escapeHtml(a.email)+' \u00b7 criado em '+fmtFull(a.criado)+'\u003c/div>\u003cdiv style=\"margin-top:10px;display:flex;gap:8px\">'+accBadge(a)+payBadge(a)+'\u003c/div>\u003cdiv class=\"mgr-actions\">'+btns.join('')+'\u003c/div>\u003cdiv style=\"font-weight:700;font-size:.9rem;margin-bottom:4px\">Mensalidades\u003c/div>'+cyc+'\u003cdiv class=\"modal-actions\">\u003cdiv>\u003c/div>\u003cbutton class=\"btn ghost\" data-act=\"close\">Fechar\u003c/button>\u003c/div>';\n  document.getElementById('a-ov-manage').classList.add('show');\n}\ndocument.getElementById('a-manage').onclick=async e=>{\n  const b=e.target.closest('[data-act]'); if(!b) return;\n  const id=document.getElementById('a-manage').dataset.id; const a=A.accounts.find(x=>x.id===id); const act=b.dataset.act; const t=todayStr();\n  if(act==='close'){ document.getElementById('a-ov-manage').classList.remove('show'); return; }\n  if(act==='edit'){ openAEdit(id); return; }\n  b.disabled = true;\n  if(act==='pay'){\n    await sb.from('tenant_payments').upsert({ tenant_id:id, ciclo:Number(b.dataset.n), vencimento:addMonthsIso(a.anchor,Number(b.dataset.n)), pago_em:t, valor:a.valor }, {onConflict:'tenant_id,ciclo'});\n  } else if(act==='unpay'){\n    await sb.from('tenant_payments').delete().eq('tenant_id',id).eq('ciclo',Number(b.dataset.n));\n  } else if(act==='pause'){\n    await sb.from('tenants').update({ status:'pausado', pausado_em:t }).eq('id',id);\n  } else if(act==='resume'){\n    const novaAncora = addDaysIso(a.anchor, Math.max(0, daysBetweenIso(a.pausedAt, t)));\n    await sb.from('tenants').update({ status:'ativo', pausado_em:null, ancora:novaAncora }).eq('id',id);\n  } else if(act==='cancel'){\n    if(!confirm('Cancelar a assinatura de '+a.empresa+'? O acesso ser\u00e1 bloqueado.')) { b.disabled=false; return; }\n    await sb.from('tenants').update({ status:'cancelado', cancelado_em:t }).eq('id',id);\n  } else if(act==='reactivate'){\n    await sb.from('tenants').update({ status:'ativo', cancelado_em:null, ancora:t }).eq('id',id);\n  } else if(act==='del'){\n    if(!confirm('Excluir '+a.empresa+' e o acesso? Isso n\u00e3o pode ser desfeito.')) { b.disabled=false; return; }\n    const r = await callFn('manage-tenant', { action:'delete', tenant_id:id });\n    if(r.error){ alert(r.error); b.disabled=false; return; }\n    await aLoadFromDb();\n    document.getElementById('a-ov-manage').classList.remove('show'); renderAdmin();\n    return;\n  }\n  await aLoadFromDb();\n  renderAdmin(); openManage(id);\n};\n['a-ov-edit','a-ov-manage'].forEach(i=>{ const o=document.getElementById(i); o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('show'); }); });\n\n/* config admin */\nfunction renderAConfig(){\n  document.getElementById('ac-valor').value=A.cfg.valorPadrao;\n  document.getElementById('ac-tol').value=A.cfg.tolerancia;\n  document.getElementById('ac-email').value= currentUser ? currentUser.email : '';\n  document.getElementById('ac-pass').value='';\n  document.getElementById('ac-pass').placeholder='deixe em branco para manter a atual';\n}\ndocument.getElementById('ac-save').onclick=async ()=>{\n  const em=document.getElementById('ac-email').value.trim(), pw=document.getElementById('ac-pass').value;\n  if(pw && pw.length\u003c6){ alert('A senha precisa ter pelo menos 6 caracteres.'); return; }\n  await sb.from('app_config').update({\n    valor_padrao: Number(document.getElementById('ac-valor').value)||0,\n    tolerancia_dias: Math.max(0, Number(document.getElementById('ac-tol').value)||0)\n  }).eq('id', true);\n  const patch = {};\n  if(em && em!==currentUser.email) patch.email = em;\n  if(pw) patch.password = pw;\n  if(Object.keys(patch).length){\n    const { error } = await sb.auth.updateUser(patch);\n    if(error){ alert('Configura\u00e7\u00f5es de mensalidade salvas, mas houve um erro ao atualizar seu login: '+error.message); }\n  }\n  await aLoadFromDb();\n  const m=document.getElementById('ac-saved'); m.classList.add('show'); setTimeout(()=>m.classList.remove('show'),2200);\n};\n\n/* ============================================================\n   INIT \u2014 retoma a sess\u00e3o do Supabase, se houver\n   ============================================================ */\n(async function init(){\n  try {\n  const { data:{ session } } = await sb.auth.getSession();\n  if(session && session.user){ await resolveSession(session.user); }\n  else { showScreen('login'); }\n  } catch(e) {showScreen('login');loginError('N\u00e3o foi poss\u00edvel retomar a sess\u00e3o. Entre novamente.');}\n  window.addEventListener('message', async e=>{if(e.source===window.parent&&e.data?.type==='follow-signout'){await doLogout();}});\n  sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){sessionRole=null;currentUser=null;showScreen('login');}});\n})();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n";

const defaults=()=>({schemaVersion:3,workspace:uid(),nextNumber:1,clients:[],services:[],quotes:[],tasks:[],accounts:[],settings:{company:'Minha empresa',doc:'',email:'',phone:'',address:'',logo:'',validDays:7,deadline:'2 dias úteis',payment:'50% na aprovação e 50% na conclusão',notes:'',auto:true,intervals:[1,3,7],weekdays:[1,2,3,4,5],time:'09:00',send:'Olá, {nome}! Segue o orçamento de {valor}: {link}',follow:'Olá, {nome}! Conseguiu analisar o orçamento de {valor}? Se precisar ajustar alguma condição, fico à disposição. {link}',negotiation:'Olá, {nome}! Vamos conversar sobre as condições do orçamento de {valor}? {link}',profile:'Responsável'}});

const Repository={load(){try{const raw=localStorage.getItem(KEY);if(!raw)return defaults();const v=JSON.parse(raw);validate(v);return v}catch(e){storageError='Não foi possível carregar os dados locais. Exporte os dados antes de limpar o navegador.';return defaults()}},save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){throw Error('Não foi possível salvar no navegador. Verifique o espaço disponível e exporte um backup.')}},export(){download('FOLLOW_backup.json',JSON.stringify(db,null,2),'application/json')}};
function validate(v){if(!v||v.schemaVersion!==3||typeof v.workspace!=='string'||!v.settings||typeof v.settings.company!=='string'||!['clients','quotes','tasks','services','accounts'].every(k=>Array.isArray(v[k]))||!Array.isArray(v.settings.intervals)||!Array.isArray(v.settings.weekdays)||!Number.isInteger(v.nextNumber))throw Error('Backup incompatível. Use um backup desta versão do FOLLOW.');v.quotes.forEach(q=>{if(!Array.isArray(q.items)||!Array.isArray(q.history)||typeof q.id!=='string'||!states.includes(q.status)||q.items.some(i=>!Number.isFinite(i.qty)||!Number.isFinite(i.price)||i.qty<=0||i.price<0))throw Error('Orçamento inválido no backup.')})}
let db=Repository.load(), view=ADMIN_MODE?'admin':'dash', term='', filter='', taskTab='Hoje', draft=null, publicData=null;

function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function modal(title,body){if(!title.startsWith('Orçamento #'))delete $('#modal').dataset.quoteId;$('#modal').innerHTML=`<div class="dialog-head"><h2 id="modal-title">${esc(title)}</h2><button data-action="close" aria-label="Fechar">×</button></div><div class="dialog-body">${body}</div>`;if(!$('#modal').open)$('#modal').showModal()}

function readyDate(base,n){let d=addDays(base,n);for(let i=0;i<7&&!db.settings.weekdays.includes(new Date(d+'T12:00:00').getDay());i++)d=addDays(d,1);return d}
function schedule(q){if(!db.settings.auto||db.tasks.some(t=>t.quoteId===q.id))return;db.settings.intervals.forEach((n,i)=>db.tasks.push({id:uid(),quoteId:q.id,date:readyDate(day(),n),stage:i+1,state:'pending'}))}

function render(){if(publicData)return renderPublic();if(!signedIn)return;if(ADMIN_MODE)view='admin';else if(!nav.some(n=>n[0]===view))view='dash';const names=Object.fromEntries(nav.map(n=>[n[0],n[2]]));$('#app').innerHTML=`<div class="shell"><aside><img class="brand" src="${BRAND}" alt="FOLLOW"><nav class="nav">${nav.map(([id,icon,label])=>`<button data-action="nav" data-id="${id}" class="${view===id?'active':''}"><span>${icon}</span>${label}</button>`).join('')}</nav><div class="sidefoot">${ADMIN_MODE?'Marc · Administração da plataforma':'Orçamentos que viram vendas.'}<br><br>Dados neste navegador</div></aside><div class="main"><header><span><span class="muted">${ADMIN_MODE?'Marc / ':'Follow / '} </span>${names[view]}</span><div class="actions"><span class="badge">Modo local</span>${button('Sair','logout','','small')}</div></header><main>${storageError?`<div class="notice">${esc(storageError)}</div>`:''}${({dash:dash,quotes:quotes,clients:clients,tasks:tasks,services:services,settings:settings,admin:admin}[view])()}</main></div></div>`}

function dash(){let sent=db.quotes.filter(q=>q.sentAt),approved=db.quotes.filter(q=>q.status==='Aprovado'),lost=db.quotes.filter(q=>q.status==='Recusado'),pending=db.quotes.filter(q=>q.sentAt&&!closed(q));return heading('Seu dia, sob controle.',new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}),button('+ Novo orçamento','newQuote','','primary'))+`<div class="grid">${metric('Retornos pendentes',due().length,'Hoje e atrasados')}${metric('Em aberto',money(pending.reduce((s,q)=>s+total(q),0)),'Enviados, visualizados e negociação')}${metric('Orçamentos enviados',sent.length,'Total acumulado')}${metric('Vendas aprovadas',money(approved.reduce((s,q)=>s+total(q),0)),approved.length+' orçamentos')}</div><div class="split"><div class="card"><div class="row"><h2>Precisa da sua atenção</h2>${button('Ver todos','nav','tasks','small')}</div>${due().slice(0,5).map(t=>taskRow(t)).join('')||empty('Nenhum retorno pendente. Seus próximos passos aparecem aqui.')}</div><div class="card"><h2>Funil de orçamentos</h2>${['Enviado','Visualizado','Negociação','Aprovado','Recusado'].map(s=>{let n=db.quotes.filter(q=>status(q)===s).length;return `<div class="line"><div class="row"><span>${s}</span><b>${n}</b></div><div class="bar"><i style="width:${n/Math.max(1,db.quotes.length)*100}%"></i></div></div>`}).join('')}<p class="muted">Conversão: <b>${approved.length+lost.length?Math.round(approved.length/(approved.length+lost.length)*100):0}%</b> · aprovados ÷ (aprovados + recusados)</p></div></div><div class="card" style="margin-top:20px"><h2>Orçamentos recentes</h2>${quoteTable(db.quotes.slice().reverse().slice(0,5))}</div>`}
